[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mishmar"
version = "0.0.1"
description = "Mishmar client: sign and submit proposals to the engine that guards your trading agent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]
keywords = ["trading", "agents", "risk", "guardrails", "hyperliquid", "binance"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://mishmar.io"
Source = "https://github.com/mishmar-io/mishmar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
