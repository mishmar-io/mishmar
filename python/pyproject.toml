[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mishmar"
version = "0.3.1"
description = "Mishmar is a risk management layer for trading bots and AI agents: every order is checked against your limits before it reaches the exchange, large orders wait for your approval, and no key can trade alone. The Python SDK: run the agent's signer, propose orders, read decisions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]
keywords = ["trading", "trading-bot", "ai-agents", "risk-management", "pre-trade-risk", "hyperliquid", "binance", "mpc", "threshold-signatures", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mishmar = "mishmar.cli:main"

[project.urls]
Homepage = "https://mishmar.io"
Source = "https://github.com/mishmar-io/mishmar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
