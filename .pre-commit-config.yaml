# Git hooks (https://pre-commit.com). Run `pre-commit install` once after
# cloning; every commit then checks the Go packages, the Python SDK and the
# TypeScript SDK (each only when its files are staged), plus a secrets scan.
# A hook that rewrites a file (gofmt, go mod tidy, ruff) fails the commit so
# the change can be reviewed and staged.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: detect hardcoded secrets

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^python/
      - id: ruff-format
        files: ^python/

  # The workflows: zizmor finds nothing unsafe in them, and every action they use is in
  # .github/workflows/actions.lock (`gh extension install github/gh-actions-lock` once;
  # after changing a `uses:` line run `gh actions-lock` and stage the lockfile).
  # .github/workflows/workflow-security.yml checks both again in CI.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        files: ^(go\.mod|go\.sum|.*\.go)$

      # CI's "The generated code is current": a spec change has to be
      # committed with the code make gen makes from it. On a mismatch the
      # regenerated files are left in the tree to review and stage.
      - id: generated-code
        name: the generated code is current (make gen, as CI checks)
        entry: bash -c 'make gen >/dev/null && git diff --exit-code --stat -- api signerapi'
        language: system
        pass_filenames: false
        files: ^(spec/openapi\.yaml|spec/signer-service\.yaml|api/|signerapi/)

      - id: go-lint
        name: go vet + gofmt (through the cgo wrapper)
        entry: make lint
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test
        name: go test ./... (includes the signing vectors; through the cgo wrapper)
        entry: make test
        language: system
        pass_filenames: false
        files: ^(.*\.go|spec/vectors/.*)$

      - id: python-tests
        name: python SDK tests
        entry: bash -c 'cd python && uv run --with pytest pytest -q'
        language: system
        pass_filenames: false
        files: ^(python/|spec/vectors/)

      - id: typescript-checks
        name: typescript SDK typecheck + tests
        entry: bash -c 'cd typescript && npm run typecheck && npm test'
        language: system
        pass_filenames: false
        files: ^(typescript/|spec/vectors/)

      - id: actions-lock
        name: every action is in .github/workflows/actions.lock (gh actions-lock --verify-local)
        entry: gh actions-lock --verify-local
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
