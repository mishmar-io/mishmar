openapi: 3.1.0
info:
  title: Mishmar API
  version: 0.21.0
  summary: Trading-aware policy service at the signing layer.
  description: |
    Mishmar checks every order, transaction or signed message an agent produces
    against wallet-wide and per-agent risk rules before the key co-signs or the
    exchange proxy forwards it.

    Three callers share it: people through the web app with a bearer token;
    agents with their own Ed25519 key, through `POST /proposals` and the
    `agent` tag (reads of their own state and the signer channel); and
    operators through the CLI. The contract lives in the public mishmar repo,
    and the engine, the web app and the SDKs are generated from it.

    Conventions:
    - All timestamps are RFC 3339 strings in UTC.
    - Money and quantities are decimal strings (see the Decimal schema), never
      JSON numbers, so the bytes an agent signs are the bytes the engine verifies
      and no cent is lost to binary floating point.
    - Every mutation of configuration bumps the account's `configRevision`.
    - Lists that can grow without bound (decisions) are cursor paginated.
servers:
  - url: http://localhost:8080/v1
    description: Self-hosted engine on a laptop
security:
  - bearerAuth: []
tags:
  - name: account
  - name: portfolios
  - name: agents
  - name: connected-accounts
  - name: rules
  - name: decisions
  - name: approvals
  - name: pnl
  - name: proposals
  - name: ledger
    description: Agent-facing. Signed with the agent's key, not the operator token.
  - name: agent
    description: |
      Agent-facing: what a bot needs to function without acting on the account.
      Reads of the agent's own decisions, approvals, positions and PnL, of the
      connected accounts it was given and their data (balances, positions,
      transactions, equity), and the signer channel through which a trade
      agent's signer co-signs venue requests. Authenticated with the agent's key (agentAuth), never the
      operator token.

paths:
  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The caller's account, its kill switch and current configuration revision
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/kill:
    post:
      tags: [account]
      operationId: killAccount
      summary: Stop all trading. Every proposal is refused, reduce-only included, until resumed.
      description: |
        The console calls this "Stop all trading". Nothing is closed or
        cancelled: the engine holds only its half of each trading key and never
        trades on its own. Positions and resting orders stay at the venue.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/pause:
    post:
      tags: [account]
      operationId: pauseAccount
      summary: Pause all trading. Only reduce-only orders pass, so agents can wind down, until resumed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/resume:
    post:
      tags: [account]
      operationId: resumeAccount
      summary: Resume trading. Clears both the stop and the pause.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }

  /account/entitlements:
    put:
      tags: [account]
      operationId: setAccountEntitlements
      summary: Write the account's entitlements. The hosted control plane does this when the plan changes; any other caller is refused.
      description: |
        What the tier includes, which the engine then reads from its
        configuration cache on every proposal (the commitment batch, the
        signer transports). Only a request the hosted control plane makes with
        its own token may write it; an operator's token is refused with 403,
        and a self-hosted engine reads a signed licence instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Entitlements' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/data-usage:
    get:
      tags: [account]
      operationId: getAccountDataUsage
      summary: How much the account's stored connected-account data takes, against what the plan includes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataUsage' }
        default: { $ref: '#/components/responses/Error' }
  /whoami:
    get:
      tags: [account]
      operationId: whoami
      summary: Who the caller is and which mode the engine runs in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        default: { $ref: '#/components/responses/Error' }

  /portfolios:
    get:
      tags: [portfolios]
      operationId: listPortfolios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [portfolios]
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [portfolios]
      operationId: getPortfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [portfolios]
      operationId: updatePortfolio
      description: |
        `removeCapital` is refused with a conflict (409) while an enabled
        leverage or drawdown rule is measured against the capital: one scoped
        to the portfolio or to one of its agents. Disable or delete those rules
        first; the conflict's details name them (`ruleIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [portfolios]
      operationId: deletePortfolio
      summary: Delete an empty portfolio. Refused (409) while it still holds agents, and for the account's default portfolio.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}/kill:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [portfolios]
      operationId: killPortfolio
      summary: Kill switch for every agent in the portfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}/resume:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [portfolios]
      operationId: resumePortfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}/default:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [portfolios]
      operationId: setDefaultPortfolio
      summary: Make this the account's default portfolio, the one an agent created without a portfolio joins
      description: |
        Every account has exactly one default portfolio. A new account starts
        with one named Main, without allocated capital. The default cannot be
        deleted: make another portfolio the default first. The default is
        otherwise an ordinary portfolio: it can be renamed, given capital,
        stopped and resumed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      parameters:
        - name: portfolioId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AgentStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [agents]
      operationId: createAgent
      summary: Add an agent. It starts active with no key, in the portfolio named or else the account's default.
      description: |
        `permission` says what the agent is for: `read` (it reads the connected
        accounts it is given and can never trade) or `trade` (it may also hold
        trading keys). `connectedAccountIds` gives it accounts from the start;
        more are given and taken away with giveAgentConnectedAccount and
        takeAgentConnectedAccount. A read agent counts against
        `Entitlements.maxAgents` like any other.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [agents]
      operationId: updateAgent
      description: |
        Moving the agent to another portfolio (`portfolioId`) is refused with a
        conflict (409) when that portfolio has no allocated capital and the agent
        has an enabled leverage or drawdown rule of its own, which would then have
        nothing to measure against; the details name the rules (`ruleIds`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Delete an agent. Its keys are revoked and its decisions are kept.
      description: |
        Retiring an agent releases its whole book: its positions on every connected account
        move to that connected account's unassigned book at the mark, so a withdrawal of what it
        held afterwards comes from the unassigned book and restricts nothing.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/keys:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: issueAgentKey
      summary: Issue a new API key. The secret is returned once and never again.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentKeyIssued' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [agents]
      operationId: revokeAgentKey
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys:
    parameters:
      - $ref: '#/components/parameters/agentId'
    get:
      tags: [agents]
      operationId: listVenueKeys
      summary: The agent's trading keys, one per connected account it may use
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [agents]
      operationId: createVenueKey
      summary: Give the agent a trading key on a connected account
      description: |
        The agent may then propose through the connected account. The key is a
        two-party key and the engine never holds it whole. For venues with
        ECDSA keys (Hyperliquid, Coinbase) it is made by two-party key
        generation: send no `engineShare`, and the agent's signer runs
        signerKeygen, after which the key carries the API wallet's address
        for the master wallet to approve (`approval`). For venues with
        Ed25519 or RSA keys it is dealt on the owner's machine for now
        (`mishmar keygen`, or `mishmar add-agent`, which does all of this):
        `engineShare` is the engine's share, the agent's share goes to the
        agent's signer, and the response carries the public key to register
        at the exchange (then `register` with the key id the venue issues).
        For HMAC venues there is no share: the signer the customer runs holds
        the whole key, and the engine records only that the key exists.
        Verify the key afterwards; it becomes `active` when the venue accepts
        a co-signed read.

        A key lives 100 days from when it becomes active (`expiresAt`), then
        expires for good. The agent holds one live key per connected account; a
        second is a conflict (409) unless it `replaces` the live one while that
        one is active and has not expired. The old key keeps signing until the
        new one becomes active, and is revoked at that moment, so the agent
        trades through the change. After a key expired, create a new one
        without `replaces`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueKeyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    get:
      tags: [agents]
      operationId: getVenueKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      operationId: revokeVenueKey
      summary: Revoke the key. The engine forgets its share; revoke the key at the venue as well.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/register:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: registerVenueKey
      summary: Record the key id the exchange issued when the public key was registered
      description: |
        Exchanges with Ed25519, ECDSA or RSA keys issue a key id on
        registration; the engine sends it in the header the venue expects.
        Verify the key next. A Hyperliquid API wallet (approved, not
        registered) and an HMAC key (its id travels with the signer that holds
        it) refuse this with a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueKeyRegistration' }
      responses:
        '200':
          description: OK. Verify the key next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/approval:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: createWalletApproval
      summary: Start the master wallet's approval of the agent's API wallet
      description: |
        Hyperliquid keys only (409 for other venues). Returns the EIP-712 typed
        data the master wallet must sign in the browser to approve this key's
        API wallet. The engine builds it, so the venue's signing rules live in
        one place. The signature goes back through `submitWalletApproval` with
        the `approvalId`. The typed data expires; ask again if it does.

        The approval names the date the key will expire (the agent name ends
        in `valid_until`), 100 days out, so the venue drops the API wallet when
        Mishmar does. An API wallet is approved once: a key already approved,
        expired or revoked is a conflict (409), since an API wallet's address
        must not be approved again once the venue may have forgotten its
        nonces. To renew, give the agent a new key (`replaces`).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletApprovalRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletApproval' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/approval/signature:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: submitWalletApproval
      summary: Submit the master wallet's signature; the engine sends the approval to the venue
      description: |
        Errors: `approval_expired` (409) when the typed data expired or was already
        used, ask for new typed data; `venue_rejected` (409) when the venue refused
        the signature, with the venue's message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletApprovalSignature' }
      responses:
        '200':
          description: |
            OK: the venue took the signature and the engine verified the key
            again. The key as the venue now sees it: approved, and active when
            every check passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/verify:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: verifyVenueKey
      summary: Prove the key end to end
      description: |
        The engine asks the agent's signer to co-sign a harmless read and sends
        it to the venue, so one call proves the whole chain: the signer is
        connected, both shares agree, the venue knows the key. Needs the agent's
        signer connected (`signer_unreachable`, 409, otherwise). Checks: the
        venue accepts the co-signed request, the key cannot withdraw, the IP
        allowlist is set (live). All pass and the key becomes `active`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/connected-accounts/{connectedAccountId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/connectedAccountId'
    put:
      tags: [agents]
      operationId: giveAgentConnectedAccount
      summary: Give the agent a connected account
      description: |
        The agent may then read the whole account: its balances, positions,
        transactions and equity, what other agents and the owner did there
        included (each transaction says who placed it). A trade agent may
        also get a trading key on it (createVenueKey, which gives the account
        by itself when the agent does not have it yet). Giving an account the
        agent already has changes nothing.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      operationId: takeAgentConnectedAccount
      summary: Take a connected account away from the agent
      description: |
        The agent's reads of it are refused from then on (403 `forbidden`);
        what it already read cannot be taken back. Refused with 409 `conflict`
        while the agent holds an unrevoked trading key on the account: revoke
        the key first.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/pause:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: pauseAgent
      summary: Pause. Only reduce-only orders pass while paused.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: resumeAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/kill:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: killAgent
      summary: Kill. Nothing passes, including reduce-only, until resumed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }

  /venue-connections:
    get:
      tags: [connected-accounts]
      operationId: listVenueConnections
      summary: The venue logins connected, each with the ids of its accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [connected-accounts]
      operationId: createVenueConnection
      summary: Connect a venue login with read access
      description: |
        For an exchange, a read-only key the engine uses for balances,
        positions and history; for Hyperliquid, the address and the network,
        nothing secret; for Fireblocks, the callback. The engine creates the
        connection's accounts at once (ConnectedAccount: one per pool of money
        the venue keeps apart, e.g. Spot and USDⓈ-M Futures on Binance), all
        `pending` with the connection until `verify` passes, which also checks
        that the access given cannot trade or withdraw. Then the engine reads
        each account's current state, and its history as far back as the venue
        serves it (`sync`). No agent is needed. Trading keys are not here:
        each trade agent gets its own on one connected account (VenueKey).

        One venue login connects once: the same venue, network or environment
        and `venueAccount.id` as a connection already there is 409
        `already_connected`, at create when the identifier is given and at
        `verify` when the venue reveals it. Refused at verify, the new
        connection stays pending and reads nothing; delete it.

        A sub-account is a connection of its own, with its own key or
        address, and counts as one on the plan (`maxVenueConnections`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueConnectionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
  /venue-connections/{venueConnectionId}:
    parameters:
      - $ref: '#/components/parameters/venueConnectionId'
    get:
      tags: [connected-accounts]
      operationId: getVenueConnection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [connected-accounts]
      operationId: updateVenueConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueConnectionUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [connected-accounts]
      operationId: deleteVenueConnection
      summary: Remove the connection and its accounts. Refused while any agent holds a venue key on one of them.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /venue-connections/{venueConnectionId}/read-key:
    parameters:
      - $ref: '#/components/parameters/venueConnectionId'
    put:
      tags: [connected-accounts]
      operationId: setReadKey
      summary: Give an exchange connection its read-only key
      description: |
        For an exchange connection added without one (or whose key the venue
        refused before it was ever verified): the key is stored whole, like at
        creation, `readKeyRegistered` turns true, and the connection can be
        verified. Refused (409 `conflict`) for a connection that is not an
        exchange's, or one already active: an active connection's key is
        not replaced; delete the connection and add it again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeReadKey' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
  /venue-connections/{venueConnectionId}/verify:
    parameters:
      - $ref: '#/components/parameters/venueConnectionId'
    post:
      tags: [connected-accounts]
      operationId: verifyVenueConnection
      summary: |
        Run the venue checks: the exchange's read-only key is accepted and can
        neither trade nor withdraw, and the environment matches; the
        Hyperliquid address exists on the network (and a sub-account belongs
        to its master); the Fireblocks callback is registered. All pass and
        the connection and its accounts become `active`. Whether an account
        can be traded (margin, one-way mode) is checked with each agent's
        trading key (`verifyVenueKey`), not here.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
  /venue-connections/{venueConnectionId}/sync:
    parameters:
      - $ref: '#/components/parameters/venueConnectionId'
    post:
      tags: [connected-accounts]
      operationId: syncVenueConnection
      summary: Read the connection's accounts from the venue now
      description: |
        Asks the collector to catch up at once instead of at its next pass:
        the console's Refresh. Answers with the connection as it stands;
        `sync` on it moves as the reads finish. A connection that is pending,
        or that the engine reads nothing from (a co-signer callback), is 409
        `conflict`. No engine does this on demand yet: every one answers 501
        `not_implemented`, and the collector's next pass is at most a minute
        away, so a console offers no Refresh until one does.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnection' }
        default: { $ref: '#/components/responses/Error' }
  /venue-connections/{venueConnectionId}/equity:
    parameters:
      - $ref: '#/components/parameters/venueConnectionId'
    get:
      tags: [connected-accounts]
      operationId: getVenueConnectionEquity
      summary: The connection's value over time, the sum of its accounts
      description: |
        Each point is one reading of the whole connection, with each
        account's share (`accounts`), so a move between two of its accounts
        changes the shares and not the total. Sub-account connections are not
        included. Same range, resolution and plan limits as an account's
        series (getConnectedAccountEquity).
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          schema: { $ref: '#/components/schemas/EquityResolution' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueConnectionEquitySeries' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts:
    get:
      tags: [connected-accounts]
      operationId: listConnectedAccounts
      summary: Every account of every venue connection, in one flat list
      description: |
        Accounts are not created here: connecting a venue login
        (createVenueConnection) creates its accounts. Each names its
        connection (`connection`), so the list is enough to tell them apart.
        In the order the connections were made, oldest first, each
        connection's accounts together in the venue's own order
        (`VenueConnection.connectedAccountIds`). The agent's list
        (agentListConnectedAccounts) is in the same order.
      parameters:
        - name: venueConnectionId
          in: query
          description: Only this connection's accounts.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [connected-accounts]
      operationId: getConnectedAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [connected-accounts]
      operationId: updateConnectedAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectedAccountUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/pause:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: pauseConnectedAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/resume:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: resumeConnectedAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/kill:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: killConnectedAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/maintenance:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: openMaintenance
      summary: Open a maintenance window to trade the account by hand
      description: |
        While the window is open the connected account's agents are paused (only
        reduce-only orders pass) and fills Mishmar did not place are expected:
        each is booked to the unassigned book for now and listed as a discrepancy
        with `duringMaintenance`, and an agents-only connected account is not restricted by
        them. Opening a window that is already open is a conflict (409).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceOpen' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/maintenance/close:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: closeMaintenance
      summary: Close the maintenance window and resume the agents it paused
      description: |
        Agents that were paused before the window opened stay paused. The
        window's fills stay where they were booked, in the unassigned book unless
        a discrepancy was resolved to an agent; the console asks the owner to
        assign them before closing, and they can be re-assigned afterwards.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/positions/reassign:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    post:
      tags: [connected-accounts]
      operationId: reassignPosition
      summary: Move part or all of a position between books on the connected account, at the mark
      description: |
        Release an agent's holding to the unassigned book (before withdrawing it),
        hand an unassigned holding to an agent (an asset deposited for it to trade),
        or move a holding between agents. Nothing is sent to the venue and the
        venue's position does not change. The move is booked at the mark: the
        giving book realises its PnL to the mark and the receiving book's entry
        price is the mark, so its PnL starts at zero. Refused (422) when the
        giving book holds less than `size` in that direction, and when the
        symbol has no mark.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionReassign' }
      responses:
        '200':
          description: The connected account's positions in the symbol, every book, after the move.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        default: { $ref: '#/components/responses/Error' }

  /connected-accounts/{connectedAccountId}/balances:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [connected-accounts]
      operationId: getConnectedAccountBalances
      summary: The connected account's balances, now or at a past moment
      description: |
        Every asset the account holds, with its price and value in USD at
        that moment, and the account's value. A past moment the engine did not observe
        is rebuilt from the account's transactions and the venue's historical
        prices (`source` says which). A moment before the plan's retention
        or before the account's history starts is 404.
      parameters:
        - name: at
          in: query
          description: The moment to answer for. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/positions:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [connected-accounts]
      operationId: getConnectedAccountPositions
      summary: The connected account's positions at the venue, now or at a past moment
      description: |
        The venue's own net position per market (a symbol with its `market` kind), whoever placed the orders
        behind it. The per-agent book is `listPositions` (people) and
        `agentListPositions` (the calling agent's own).
      parameters:
        - name: at
          in: query
          description: The moment to answer for. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPositionSnapshot' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [connected-accounts]
      operationId: listConnectedAccountTransactions
      summary: Trades, transfers, funding and fees on the connected account, as the venue reports them
      description: |
        Newest first, as the venue reports them, each once. `origin` says who
        placed a trade: an agent through Mishmar, or something outside it.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AccountTransactionKind' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTransactionPage' }
        default: { $ref: '#/components/responses/Error' }
  /connected-accounts/{connectedAccountId}/equity:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [connected-accounts]
      operationId: getConnectedAccountEquity
      summary: The connected account's value in USD over time
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          description: |
            How far apart the points are. Absent, the engine picks one that
            gives a few hundred points over the range. Never finer than the
            plan allows (`Entitlements.accountData.resolutionSeconds`).
          schema: { $ref: '#/components/schemas/EquityResolution' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquitySeries' }
        default: { $ref: '#/components/responses/Error' }
  /discrepancies:
    get:
      tags: [connected-accounts]
      operationId: listDiscrepancies
      summary: Changes at the venue the books could not explain, newest first
      description: |
        What the console's resolve screen lists: fills Mishmar did not place,
        positions or balances that disagree with the books, and stream gaps.
        Each says what it restricts while open (`restricts`).
      parameters:
        - name: connectedAccountId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DiscrepancyStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }
  /discrepancies/{discrepancyId}:
    parameters:
      - $ref: '#/components/parameters/discrepancyId'
    get:
      tags: [connected-accounts]
      operationId: getDiscrepancy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }
  /discrepancies/{discrepancyId}/resolve:
    parameters:
      - $ref: '#/components/parameters/discrepancyId'
    post:
      tags: [connected-accounts]
      operationId: resolveDiscrepancy
      summary: Say what the change was, which lifts whatever it restricted
      description: |
        Assign a fill or a position difference to the unassigned book or to an
        agent on the connected account, or record a balance change as a transfer
        (`capital`). A resolved discrepancy can be resolved again to move it,
        so a re-attribution after the fact is the same call. Resolving a
        stream gap is refused (409): the engine clears it when it has re-read
        the venue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscrepancyResolve' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }

  /rules:
    get:
      tags: [rules]
      operationId: listRules
      parameters:
        - name: scopeKind
          in: query
          schema: { $ref: '#/components/schemas/ScopeKind' }
        - name: scopeId
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [rules]
      operationId: createRule
      description: |
        An enabled leverage or drawdown rule scoped to a portfolio, or to an agent,
        is measured against that portfolio's allocated capital (the agent's
        portfolio for an agent rule; see RuleMetric). Without capital it would
        refuse every order, so it is refused here instead: `validation` (422),
        naming the portfolio to give capital to. A disabled rule is accepted and
        checked when it is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        default: { $ref: '#/components/responses/Error' }
  /rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/ruleId'
    get:
      tags: [rules]
      operationId: getRule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [rules]
      operationId: updateRule
      description: |
        The same check as createRule, on the rule as it would be after the
        update: enabling a leverage or drawdown rule, or moving one to a
        portfolio or agent scope, needs that portfolio's allocated capital.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [rules]
      operationId: deleteRule
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }

  /decisions:
    get:
      tags: [decisions]
      operationId: listDecisions
      summary: Every proposal with its verdict and inputs, newest first
      parameters:
        - name: agentId
          in: query
          schema: { type: string }
        - name: portfolioId
          in: query
          schema: { type: string }
        - name: connectedAccountId
          in: query
          schema: { type: string }
        - name: verdict
          in: query
          schema: { $ref: '#/components/schemas/Verdict' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionPage' }
        default: { $ref: '#/components/responses/Error' }
  /decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [decisions]
      operationId: getDecision
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        default: { $ref: '#/components/responses/Error' }

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Proposals that require a person, newest first
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}:
    parameters:
      - $ref: '#/components/parameters/approvalId'
    get:
      tags: [approvals]
      operationId: getApproval
      summary: One approval, with the rules re-run against the account as it is now
      description: |
        A pending approval carries `now`: the parked proposal evaluated again
        against the current book, marks, PnL, statuses and restrictions, with
        each rule's observed value and threshold, the verdict that would fall
        today, and a `revision` of it. Show it to the approver, and send the
        `revision` with the approve so the engine knows what they saw. A
        decided or expired approval has no `now`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}/approve:
    parameters:
      - $ref: '#/components/parameters/approvalId'
    post:
      tags: [approvals]
      operationId: approveApproval
      summary: Co-sign. The engine forwards the proposal to its connected account.
      description: |
        The engine checks the statuses first (a stop, a pause, a stopped agent,
        portfolio or connected account, a lost grant, a restriction: 409
        `conflict`, the approval stays pending), then runs the rules once more
        against the account as it is now. A verdict of `block` now refuses the
        approve (409 `conflict`, `details.now` says which rule); `require_approval`
        or `allow` is the approver's call. When the request names the `revision`
        the approver saw and the evaluation now has another, the answer is 409
        `evaluation_changed` with `details.now`, for the approver to confirm
        again with the new `revision`. Without a `revision` only the block check
        applies. Nothing is decided on a 409.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecide' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '409':
          description: >-
            Not approved and still pending: the approval is no longer pending (`conflict`),
            a status or restriction refuses it (`conflict`), the rules block it now
            (`conflict`, with `details.now`), or the evaluation moved since the approver
            read it (`evaluation_changed`, with `details.now`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{approvalId}/reject:
    parameters:
      - $ref: '#/components/parameters/approvalId'
    post:
      tags: [approvals]
      operationId: rejectApproval
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecide' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        default: { $ref: '#/components/responses/Error' }

  /proposals:
    post:
      tags: [proposals]
      operationId: submitProposal
      security: []
      summary: Submit a proposal for evaluation
      description: |
        Agent-facing. The agent names its key by `keyId` and proves possession
        with an Ed25519 signature over the canonical proposal (see
        ProposalSubmit). The engine never holds the agent's private key.

        The engine decodes the action, evaluates every rule in scope against
        the projected state, writes the decision to the ledger, and only then
        forwards it (`allow`), parks it for a person (`require_approval`) or
        rejects it (`block`). The response is the decision either way.
        Venue-shaped endpoints wrap this in later build steps.

        Exits: a reduce-only order that moves both the agent's own position
        and the connected account's net position in the symbol toward zero, without
        crossing zero, is an exit. Its size may be at most the smaller of the
        two, and zero when they point opposite ways. Every rule without
        `appliesToExits` is waived for an exit and recorded as waived; a stop
        still refuses it, a pause lets it through. A reduce-only order larger
        than the exit size is blocked, not resized, with the exit size in the
        reason. A plain order is never an exit, even one that reduces. Exits
        already working at the venue count against both positions. Only a
        venue that enforces reduce-only itself can have exits: the engine
        judges an order when it decides, and only the venue sees the position
        when the order fills. On any other venue a reduce-only order runs
        every rule like a plain one.

        Cancels (`kind: cancel`) pull a resting order the same agent placed
        through Mishmar on the same connected account: no rules run, nothing waits for a
        person, and a stop does not refuse them.

        One-shot (`venueMessage`): the agent's signer has already built the
        venue request and signed its half, so an allowed order is co-signed
        and forwarded with no round trip to the signer.

        Sent again: a proposal whose `nonce` the engine already decided under
        the same `keyId` gets that decision back, as it stands now (its venue
        ack and approval included), with nothing decided, written or forwarded
        again. That is what an SDK retrying the same body after a lost answer
        receives. The nonce is remembered for twice the proposal age limit
        (two minutes); past that the proposal is stale anyway (401).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposalSubmit' }
      responses:
        '200':
          description: Evaluated. Read `verdict`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '401':
          description: >-
            Unknown or revoked key, bad signature, stale `proposedAt`, or a `nonce` already
            spent whose decision the engine no longer holds (the same body again gets its
            decision, 200, while it does).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }

  /agent/me:
    get:
      tags: [agent]
      operationId: agentGetIdentity
      security: [{ agentAuth: [] }]
      summary: Who the calling key belongs to
      description: |
        The agent, account and key id the key was issued for, so a signer
        set up from the key alone (`MISHMAR_API_KEY`) learns its agent without
        an operator token or a flag. An unknown or revoked key is 401 like
        any agent call, which makes this the one read that proves a key.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentIdentity' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/decisions:
    get:
      tags: [agent]
      operationId: agentListDecisions
      security: [{ agentAuth: [] }]
      summary: The calling agent's decisions, newest first
      description: |
        The same page as `listDecisions`, restricted to the decisions of the
        agent the key belongs to, so a bot can follow what happened to its
        proposals without an operator token.
      parameters:
        - name: connectedAccountId
          in: query
          schema: { type: string }
        - name: verdict
          in: query
          schema: { $ref: '#/components/schemas/Verdict' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionPage' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agent]
      operationId: agentGetDecision
      security: [{ agentAuth: [] }]
      summary: One of the calling agent's decisions
      description: A decision of another agent is 404, not 403; the agent learns nothing about it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/approvals:
    get:
      tags: [agent]
      operationId: agentListApprovals
      security: [{ agentAuth: [] }]
      summary: The calling agent's proposals that wait for, or were decided by, a person
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApprovalStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Approval' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/positions:
    get:
      tags: [agent]
      operationId: agentListPositions
      security: [{ agentAuth: [] }]
      summary: The calling agent's open positions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/pnl:
    get:
      tags: [agent]
      operationId: agentGetPnl
      security: [{ agentAuth: [] }]
      summary: Daily realized and unrealized PnL of the calling agent
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnlSeries' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/venue-keys:
    get:
      tags: [agent]
      operationId: agentListVenueKeys
      security: [{ agentAuth: [] }]
      summary: The calling agent's trading keys, live and past
      description: |
        What the agent's signer needs to sign with the right key: while a
        replacement is pending the agent holds two keys on one trading
        account and signs with the active one, and a revoked or expired
        key's share can be dropped. Also when each key expires, for an agent
        that warns its operator.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenueKey' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts:
    get:
      tags: [agent]
      operationId: agentListConnectedAccounts
      security: [{ agentAuth: [] }]
      summary: The connected accounts the calling agent was given
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedAccount' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}:
    parameters:
      - name: connectedAccountId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agent]
      operationId: agentGetConnectedAccount
      security: [{ agentAuth: [] }]
      summary: A connected account as the agent may see it, its connection's setup without any secret
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectedAccount' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}/venue-rules:
    parameters:
      - name: connectedAccountId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [agent]
      operationId: agentGetVenueRules
      security: [{ agentAuth: [] }]
      summary: What the connected account's venue accepts, per symbol, for the signer that builds orders
      description: |
        Tick, step and minimums, and the venue's own encoding of each symbol,
        as the engine last read them from the venue. The signer caches them
        and builds venue requests within them; the engine checks a one-shot
        message against the same rules when it decodes it. A connected account the agent
        holds no venue key on is 404.
      parameters:
        - name: symbol
          in: query
          description: Only this symbol.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueRules' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}/balances:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [agent]
      operationId: agentGetAccountBalances
      security: [{ agentAuth: [] }]
      summary: The connected account's balances, now or at a past moment
      description: |
        Only for an account the agent was given (403 `forbidden` otherwise);
        each read is written to the access log. Every asset the account
        holds, with its price and value in USD at that moment, and the
        account's value. A past moment the engine did not observe
        is rebuilt from the account's transactions and the venue's historical
        prices (`source` says which). A moment before the plan's retention
        or before the account's history starts is 404.
      parameters:
        - name: at
          in: query
          description: The moment to answer for. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceSnapshot' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}/positions:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [agent]
      operationId: agentGetAccountPositions
      security: [{ agentAuth: [] }]
      summary: The connected account's positions at the venue, now or at a past moment
      description: |
        The venue's own net position per market (a symbol with its `market` kind), whoever placed the orders
        behind it. The per-agent book is `listPositions` (people) and
        `agentListPositions` (the calling agent's own).
      parameters:
        - name: at
          in: query
          description: The moment to answer for. Absent means now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPositionSnapshot' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}/transactions:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [agent]
      operationId: agentListAccountTransactions
      security: [{ agentAuth: [] }]
      summary: Trades, transfers, funding and fees on the connected account, as the venue reports them
      description: |
        Newest first, as the venue reports them, each once. `origin` says who
        placed a trade: an agent through Mishmar, or something outside it.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/AccountTransactionKind' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountTransactionPage' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/connected-accounts/{connectedAccountId}/equity:
    parameters:
      - $ref: '#/components/parameters/connectedAccountId'
    get:
      tags: [agent]
      operationId: agentGetAccountEquity
      security: [{ agentAuth: [] }]
      summary: The connected account's value in USD over time
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: resolution
          in: query
          description: |
            How far apart the points are. Absent, the engine picks one that
            gives a few hundred points over the range. Never finer than the
            plan allows (`Entitlements.accountData.resolutionSeconds`).
          schema: { $ref: '#/components/schemas/EquityResolution' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EquitySeries' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/signer/commitments:
    post:
      tags: [agent]
      operationId: requestCommitments
      security: [{ agentAuth: [] }]
      summary: Take a batch of the engine's single-use commitments for one-shot signing
      description: |
        FROST needs both parties' commitments before either computes a share,
        so the engine hands the agent's signer a batch of its own ahead of
        time, and the signer can then sign an order's half by itself
        (ProposalSubmit.venueMessage). Each commitment is used once, whatever
        the decision, and expires 24 hours after it was issued. The account's
        entitlements cap how many unused ones a signer may hold per venue key
        (`commitmentBatch`): a request returns at most the difference, possibly
        none, and a burst that outruns the batch falls back to the signer
        channel. Two-party ECDSA keys presign through signerPresign instead
        and answer 409 here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitmentRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitmentBatch' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/signer/keygen:
    post:
      tags: [agent]
      operationId: signerKeygen
      security: [{ agentAuth: [] }]
      summary: Run a round of two-party key generation for one of the agent's venue keys
      description: |
        Two-party ECDSA keys (Hyperliquid API wallets, Coinbase) are made by
        the protocol's own key generation between the agent's signer and the
        engine's signer, so no machine ever holds both shares: nothing is
        dealt and nothing is pasted. The operator creates the venue key
        without `engineShare` (createVenueKey), and the agent's signer then
        runs two rounds here. Round 1 names the key and gets the engine's
        first message; round 2 carries the signer's answer and gets the
        engine's last message with the joint public key, which the signer
        checks against its own. The engine records the
        public key and the address on the venue key, which is then approved
        at the venue like any other (`approval`, `verify`). Only the key's own
        agent may run it, and once: a key that has a public key already
        answers 409. A session expires a minute after round 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeygenRound' }
      responses:
        '200':
          description: The engine's message for the round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeygenRoundResult' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/signer/presign:
    post:
      tags: [agent]
      operationId: signerPresign
      security: [{ agentAuth: [] }]
      summary: Run a round of presigning for one of the agent's two-party ECDSA keys
      description: |
        Two-party ECDSA exchanges three messages between the signers before a
        signature's last step, and none of them depends on the order. The
        signer runs them here ahead of time for a batch of nonces, and an
        order then carries only the last step (ProposalSubmit.venueMessage,
        naming its slot as `engineCommitmentId` and carrying the signer's
        message as `share`), so an allowed Hyperliquid order needs no round
        trip back to the signer, as a Binance order with FROST commitments
        does not. Round 1 names the key, how many nonces the signer wants and
        its half of the session id, and gets the engine's first message;
        round 2 carries the signer's answer and gets the engine's last
        message with the slots. Each slot is used once, whatever the
        decision, and expires 24 hours after it was made. The account's
        entitlement caps the unused slots a signer may hold per key
        (`commitmentBatch`): round 1 may grant fewer than asked, and answers
        409 when none is left. A nonce used twice reveals the key, so a signer
        that fails round 2 discards its half, and the engine keeps its halves
        in memory only, as it keeps FROST commitments
        (CommitmentBatch.engineInstance).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresignRound' }
      responses:
        '200':
          description: The engine's message for the round.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PresignRoundResult' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/signer/poll:
    post:
      tags: [agent]
      operationId: signerPoll
      security: [{ agentAuth: [] }]
      summary: Wait for venue requests the agent's signer must sign
      description: |
        The signer channel's first transport: long-poll. The agent's signer
        keeps one of these open; the engine answers as soon as it has
        something to sign for this agent, or with an empty list when
        `waitSeconds` pass. Each request is handed out once; a request taken
        and not answered before it expires is handed out again with a higher
        `attempt`. The messages are the same whatever the transport, so a
        WebSocket or a webhook can carry them later without changing the
        signer or the engine.

        Every answer names the engine instance (`Mishmar-Engine-Instance`),
        which changes each time the engine starts. The engine keeps its
        one-shot commitments in memory only, so a signer that sees a new
        instance drops the commitments it holds and takes a fresh batch
        rather than finding out from a refused proposal.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignerPoll' }
      responses:
        '200':
          description: Requests to sign, possibly none.
          headers:
            Mishmar-Engine-Instance:
              required: true
              description: The engine instance answering; see CommitmentBatch.engineInstance.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SignRequest' }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }
  /agent/signer/requests/{requestId}/answer:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [agent]
      operationId: signerAnswer
      security: [{ agentAuth: [] }]
      summary: Answer a sign request
      description: |
        The signer's share, signature or forwarded venue response, or its
        refusal. An answer whose `kind` does not fit the request's scheme is
        refused (422). An answer to a request that is not open is 404: already
        answered, expired, or never made.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignerAnswer' }
      responses:
        '204':
          description: Taken. The decision records what the signer did.
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /access-log:
    get:
      tags: [connected-accounts]
      operationId: listAccessLog
      summary: Which agent read which connected account's data, newest first
      parameters:
        - name: agentId
          in: query
          schema: { type: string }
        - name: connectedAccountId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogPage' }
        default: { $ref: '#/components/responses/Error' }
  /ledger/head:
    get:
      tags: [ledger]
      operationId: getLedgerHead
      summary: The audit ledger's latest event and the engine's public key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerHead' }
        default: { $ref: '#/components/responses/Error' }
  /ledger/events:
    get:
      tags: [ledger]
      operationId: listLedgerEvents
      summary: Page through the audit ledger, oldest first
      description: |
        Every change the ledger ever recorded, hash-chained and in order. Export the
        whole chain with `mishmar-engine export-ledger` and check it offline with
        `mishmar-engine verify-ledger`, which recomputes every hash and verifies every
        engine and agent signature with the public keys alone.
      parameters:
        - in: query
          name: after
          schema: { type: integer, format: int64, minimum: 0 }
          description: Return events with a sequence number above this. Default 0.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000 }
          description: Page size, default 200.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEventPage' }
        default: { $ref: '#/components/responses/Error' }
  /pnl/summary:
    get:
      tags: [pnl]
      operationId: getPnlSummary
      summary: One row per account, portfolio and agent with today and month-to-date PnL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnlSummary' }
        default: { $ref: '#/components/responses/Error' }
  /pnl:
    get:
      tags: [pnl]
      operationId: getPnl
      summary: Daily realized and unrealized PnL for one scope
      parameters:
        - name: scopeKind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ScopeKind' }
        - name: scopeId
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PnlSeries' }
        default: { $ref: '#/components/responses/Error' }
  /positions:
    put:
      tags: [pnl]
      operationId: replacePositions
      summary: Replace the account's positions and equity (development)
      description: |
        Until venue streams feed the state service, this is how positions,
        marks and equity get into the engine so rules have something to check.
        Replaces the whole set. Goes away when the connected accounts report real fills.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateImport' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [pnl]
      operationId: listPositions
      summary: Open positions from the state service, optionally narrowed to one scope
      parameters:
        - name: scopeKind
          in: query
          schema: { $ref: '#/components/schemas/ScopeKind' }
        - name: scopeId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A static operator token for self-hosted, a session token for hosted.
    agentAuth:
      type: apiKey
      in: header
      name: X-Mishmar-Signature
      description: |
        Agent-facing endpoints (tag `agent`) are authenticated by the agent's
        Ed25519 key, never by the operator token. Four headers:

        - `X-Mishmar-Key-Id`: the key id (key_…).
        - `X-Mishmar-Signed-At`: RFC 3339 in UTC; rejected when more than 60
          seconds off the engine's clock.
        - `X-Mishmar-Nonce`: unique per request for this key; a replay within
          the engine's window is rejected.
        - `X-Mishmar-Signature`: base64 Ed25519 signature over the canonical
          JSON (keys sorted, no whitespace, absent fields omitted) of
          `{"bodySha256","keyId","method","nonce","path","query","signedAt"}`,
          where `method` is upper case, `path` is the request path without the
          server prefix (`/agent/decisions`), `query` is the raw query string
          without the `?` (absent when empty) and `bodySha256` is the
          lower-case hex SHA-256 of the request body (absent when there is none).

        The bytes are pinned in spec/vectors/agent-request-signing.json and the
        SDKs sign this way themselves. `POST /proposals` keeps its signature
        inside the body.
  parameters:
    portfolioId:
      name: portfolioId
      in: path
      required: true
      schema: { type: string }
    agentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    connectedAccountId:
      name: connectedAccountId
      in: path
      required: true
      schema: { type: string }
    venueConnectionId:
      name: venueConnectionId
      in: path
      required: true
      schema: { type: string }
    ruleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string }
    approvalId:
      name: approvalId
      in: path
      required: true
      schema: { type: string }
    venueKeyId:
      name: venueKeyId
      in: path
      required: true
      schema: { type: string }
    discrepancyId:
      name: discrepancyId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AgentUnauthorized:
      description: Unknown or revoked key, bad signature, stale `X-Mishmar-Signed-At` or replayed `X-Mishmar-Nonce`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine code: `not_found`, `conflict`, `validation`, `unauthorized`,
            `forbidden`, `unavailable`, `rate_limited`, `too_large`, `approval_expired`,
            `venue_rejected`, `limit_reached`, `signer_unreachable`, `evaluation_changed`,
            `internal`, `not_implemented` (501: in the contract, not yet in this engine).
            `already_connected` (409) answers connecting or verifying a venue login
            that is connected already; `details.venueConnectionId` is the existing one.
            `evaluation_changed` (409) answers an approve whose `revision` is not the
            current evaluation's: the rules now say something else than what the approver
            saw. `details.now` is the current ApprovalEvaluation; show it and approve again
            with its `revision`. Nothing was decided.
            `signer_unreachable` (409) means the request needs the agent's signer and none
            answered (verifyVenueKey's co-signed read). Nothing was recorded: start the
            signer and send the same request again.
            `limit_reached` (403) means the account's plan holds no more of what
            the request would add (`Entitlements.maxAgents`, `maxVenueConnections`).
            Sending it again changes nothing: delete one, or move to a larger plan.
            `unavailable` (503) means the request did nothing: the engine cannot read its
            state, it is starting or waiting for its account, or it is stopping. Send the
            same request again after the seconds in the `Retry-After` header (one, while
            an engine starts or stops).
            `rate_limited` (429) also means the request did nothing: this caller has sent
            too many requests. Wait the seconds in the `Retry-After` header, then send the
            same request again. `too_large` (413) means the body was over the limit the
            engine accepts; sending it again changes nothing.
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: |
        A decimal number as a string: "98000.25", "-1234.5", "0.001". Money and
        quantities are never JSON numbers. A string survives every language's
        float formatting unchanged, so the bytes an agent signs are the bytes the
        engine verifies, and sums of cents stay exact.

    ScopeKind:
      type: string
      enum: [account, portfolio, agent, connected_account]
    Scope:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/ScopeKind' }
        id: { type: string }

    Account:
      type: object
      required: [id, name, killSwitch, paused, configRevision, defaultPortfolioId, entitlements, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        killSwitch:
          type: boolean
          description: |
            True while all trading is stopped (killAccount): every proposal
            from every agent is refused, reduce-only included. Nothing is
            closed or cancelled; positions and resting orders stay at the venue.
        paused:
          type: boolean
          description: |
            True while all trading is paused (pauseAccount): only reduce-only
            orders pass, so agents can close their own positions. A stop
            outranks a pause.
        configRevision:
          type: integer
          description: Bumped on every configuration change. Decisions record the revision they were evaluated under.
        defaultPortfolioId:
          type: string
          description: |
            The account's default portfolio: the one an agent created without a
            portfolio joins, and the one portfolio that cannot be deleted
            (setDefaultPortfolio moves it).
        entitlements: { $ref: '#/components/schemas/Entitlements' }
        createdAt: { type: string, format: date-time }

    Tier:
      type: string
      enum: [free, pro, enterprise]
      description: |
        The account's plan: free, pro, or enterprise (by contact; billing never
        puts an account on it by itself). There is no team plan (7 November 2026).
    SignerTransport:
      type: string
      enum: [long_poll, websocket, webhook, queue]
      description: How the engine reaches an agent's signer. The messages are the same on every transport.
    Entitlements:
      type: object
      description: |
        What the account's tier includes (plan doc, Pricing). Billing writes it
        for hosted accounts and a self-hosted engine reads it from its signed
        licence; the API only reads it. Safety is never gated: every rule, the
        stop, the pause, cancels, exits and approvals are in every tier.
      required: [tier, signerTransports, commitmentBatch, dedicatedCell, failoverCell, selfHosted]
      properties:
        tier: { $ref: '#/components/schemas/Tier' }
        signerTransports:
          type: array
          description: The transports the signer channel may use. long_poll is in every tier.
          items: { $ref: '#/components/schemas/SignerTransport' }
        commitmentBatch:
          type: integer
          minimum: 1
          description: |
            The most unused engine commitments (or presignatures) an agent's
            signer may hold per venue key: how many orders in a burst take the
            one-shot path before the rest fall back to the signer channel.
        dedicatedCell:
          type: boolean
          description: The account runs on a cell of its own.
        failoverCell:
          type: boolean
          description: A standby cell in another availability zone takes over when the account's cell fails (the uptime guarantee).
        selfHosted:
          type: boolean
          description: Licensed to run the engine on the customer's own infrastructure.
        maxAgents:
          type: integer
          minimum: 1
          description: |
            The most agents the account may have, stopped ones and read agents
            included. Absent means no limit. An account already over it keeps what it has;
            createAgent is refused with `limit_reached` until one is deleted.
        maxVenueConnections:
          type: integer
          minimum: 1
          description: |
            The most venue connections the account may have, on every venue
            together. Absent means no limit. createVenueConnection is refused
            with `limit_reached` past it, as createAgent is. A connection
            counts once whatever the number of accounts under it; a
            sub-account's connection counts like any other; one Mishmar only
            reads counts like one agents trade on. Before contract 0.21.0
            this was `maxConnectedAccounts`.
        accountData: { $ref: '#/components/schemas/AccountDataEntitlements' }
        venueBudgets:
          type: array
          description: |
            The account's share of each venue's request budget. A venue limits
            requests per address, and accounts may share an address, so each
            takes no more than its share. The engine counts every request it
            makes to the venue for the account: reads, polling, orders and
            cancels. When the share is spent, polling waits, and a new order
            is refused with `rate_limited` until the share refills; exits and
            cancels always go. A venue not listed has no share of its own.
          items: { $ref: '#/components/schemas/VenueBudget' }
    VenueBudget:
      type: object
      required: [venue, weightPerMinute]
      properties:
        venue: { $ref: '#/components/schemas/Venue' }
        weightPerMinute:
          type: integer
          minimum: 1
          description: |
            Request weight a minute, in the venue's own units: Hyperliquid's
            and Binance's published weights per request.

    EngineMode:
      type: string
      enum: [paper, live]
      description: |
        paper: venues are simulated or test networks; fixtures may be imported.
        live: real venues and real money; the engine refuses fixtures and refuses
        to start if any connected account's venue lacks a live adapter.
    Operator:
      type: object
      required: [name, mode]
      properties:
        name:
          type: string
          description: The person behind the bearer token. Recorded on approvals as decidedBy.
        mode: { $ref: '#/components/schemas/EngineMode' }

    PortfolioStatus:
      type: string
      enum: [active, killed]
    Portfolio:
      type: object
      required: [id, name, isDefault, status, agentCount, grossExposureUsd, netExposureUsd, dayPnlUsd, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        capitalUsd:
          $ref: '#/components/schemas/Decimal'
          description: |
            The capital allocated to the portfolio: what leverage (gross exposure ÷
            capital) and drawdown are measured against, for the portfolio and for
            each of its agents. It is not a cap on exposure; a gross_exposure rule
            is. Absent when none is set, and then no leverage or drawdown rule may
            be scoped to the portfolio or its agents (createRule).
        isDefault:
          type: boolean
          description: True for the account's default portfolio (Account.defaultPortfolioId), which cannot be deleted.
        status: { $ref: '#/components/schemas/PortfolioStatus' }
        agentCount: { type: integer }
        grossExposureUsd: { $ref: '#/components/schemas/Decimal' }
        netExposureUsd: { $ref: '#/components/schemas/Decimal' }
        dayPnlUsd: { $ref: '#/components/schemas/Decimal' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PortfolioCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        capitalUsd:
          $ref: '#/components/schemas/Decimal'
          description: The capital allocated to the portfolio (Portfolio.capitalUsd). Absent for none.
    PortfolioUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        capitalUsd: { $ref: '#/components/schemas/Decimal' }
        removeCapital:
          type: boolean
          description: |
            True takes the allocated capital away; capitalUsd must then be absent.
            Refused while a leverage or drawdown rule is measured against it
            (updatePortfolio).

    AgentStatus:
      type: string
      enum: [active, paused, killed]
    AgentKey:
      type: object
      required: [id, prefix, createdAt]
      properties:
        id:
          type: string
          description: key_<account suffix>_<12 random characters>; the account id is readable off it (acc_<suffix>), so a hosted router can map a proposal to its account's cell from the key id alone.
        prefix:
          type: string
          description: First characters of the key, enough to recognise it. Never the secret.
        publicKey:
          type: string
          description: The agent's Ed25519 public key, base64. The engine verifies proposal signatures with it.
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    AgentKeyIssued:
      allOf:
        - $ref: '#/components/schemas/AgentKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The agent's API key, shown once:
                `msk_<environment>_<account suffix>_<key random part>_<seed>`.
                The seed is the agent's Ed25519 private key, base64url; before
                it, what names the engine and the key: the environment
                (`testnet`, `prod`, … for hosted Mishmar, which the CLI and the
                SDKs map to the API host; anything else means `MISHMAR_ENGINE`
                names the engine) and the key id's two parts
                (`key_<account suffix>_<random part>`). An agent needs nothing
                else: `mishmar signer run` with the key in `MISHMAR_API_KEY`
                writes its config, learns its agent from `GET /agent/me` and
                generates the trading keys added for it. The engine keeps only
                the public key, so a leaked engine database cannot sign as the
                agent. A key issued before 0.19.0 is `msk_<6 characters>_<seed>`
                and keeps working, with the engine URL and key id given by hand.
    AgentIdentity:
      type: object
      description: Who an agent key belongs to, as `GET /agent/me` answers the key.
      required: [agentId, agentName, accountId, keyId, portfolioId, permission]
      properties:
        agentId: { type: string }
        agentName: { type: string }
        accountId: { type: string }
        keyId: { type: string }
        portfolioId: { type: string }
        permission:
          $ref: '#/components/schemas/AgentPermission'
          description: |
            What the agent may do. A signer or MCP server started with the
            key reads it first: for a read agent it starts no signer channel
            and no key sync, so every call it makes is a read of
            connected-account data, which a hosted account's collector
            answers while the engine sleeps. An engine from before this field
            sends none; a client treats that as trade.
    SignerPresence:
      type: object
      description: |
        Whether the agent's signer is reaching this engine: `connected` while
        it holds a poll open or made a signer call within the last half
        minute. `lastSeenAt` is its last signer call since the engine started;
        absent when there was none. Kept in memory, so an engine restart
        forgets it until the signer polls again, which a running signer does
        within seconds.
      required: [connected]
      properties:
        connected: { type: boolean }
        lastSeenAt: { type: string, format: date-time }
    Agent:
      type: object
      required: [id, name, permission, portfolioId, status, keys, venueKeys, connectedAccountIds, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        permission: { $ref: '#/components/schemas/AgentPermission' }
        portfolioId: { type: string }
        status: { $ref: '#/components/schemas/AgentStatus' }
        keys:
          type: array
          items: { $ref: '#/components/schemas/AgentKey' }
        venueKeys:
          type: array
          description: The agent's trading keys, one per connected account it may trade on. Always empty for a read agent.
          items: { $ref: '#/components/schemas/VenueKey' }
        connectedAccountIds:
          type: array
          description: |
            The connected accounts the agent was given: it may read each one
            whole. A trade agent trades on those where it holds an unrevoked
            venue key (`venueKeys`); getting a key on an account gives the
            account. Before contract 0.20.0 this list was derived from the
            keys alone.
          items: { type: string }
        signer:
          $ref: '#/components/schemas/SignerPresence'
          description: Whether the agent's signer is reaching the engine. Absent when the engine does not track it (no signer channel).
        lastDecisionAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentPermission:
      type: string
      enum: [read, trade]
      description: |
        read: the agent has a Mishmar API key and reads the connected accounts
        it is given; it has no signer and can hold no trading key
        (createVenueKey answers 409 `conflict`), and its proposals are refused
        (403 `forbidden`). trade: it may also hold trading keys and propose
        orders on the accounts it holds one on.
    AgentCreate:
      type: object
      required: [name, permission]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        permission:
          $ref: '#/components/schemas/AgentPermission'
          description: Required, with no default, so that whoever adds an agent says what it may do.
        connectedAccountIds:
          type: array
          description: Connected accounts to give the agent from the start. Default none.
          items: { type: string }
        portfolioId:
          type: string
          description: Absent for the account's default portfolio (Account.defaultPortfolioId).
    AgentUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        portfolioId: { type: string }
        permission:
          $ref: '#/components/schemas/AgentPermission'
          description: |
            read to trade lets the agent get trading keys from then on; each
            still needs its own setup at the venue. trade to read is refused
            with 409 `conflict` while the agent holds an unrevoked trading key.
    VenueKeyScheme:
      type: string
      enum: [ed25519, ecdsa, rsa, hmac]
      description: |
        The venue's key type, which alone decides how the key is held and used:
        Ed25519, ECDSA and RSA keys are two-party keys (FROST, two-party ECDSA,
        two-party RSA) with one share in the engine and one in the agent's
        signer; HMAC keys are held whole by the signer the customer runs, which
        signs only what both the agent and the engine signed. Per venue:
        Binance ed25519, Hyperliquid ecdsa (an API wallet), Bybit rsa, Coinbase
        ecdsa, OKX hmac.
    VenueKeyStatus:
      type: string
      enum: [pending, active, expired, revoked]
      description: |
        pending until the venue accepts a co-signed read, active until
        `expiresAt` or revocation. An expired key never signs again: the
        engine forgets its share, as on revocation.
    VenueKey:
      type: object
      description: One agent's trading key on one connected account. Created with the engine's share (or nothing, for HMAC venues), registered or approved at the venue, verified by a co-signed read, revoked by the operator.
      required: [id, agentId, connectedAccountId, venue, scheme, status, apiKeyRegistered, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        connectedAccountId: { type: string }
        venue: { $ref: '#/components/schemas/Venue' }
        scheme: { $ref: '#/components/schemas/VenueKeyScheme' }
        status: { $ref: '#/components/schemas/VenueKeyStatus' }
        publicKey:
          type: string
          description: |
            What the venue needs to know the key: the public key to register at an
            exchange (SPKI PEM), or the API wallet's address for the master wallet
            to approve on Hyperliquid. Absent for HMAC keys, and for an ECDSA
            key until its key generation is done.
        fingerprint: { type: string }
        keygen:
          type: string
          enum: [pending, done]
          description: |
            Two-party ECDSA keys, which are made by key generation: pending
            until the agent's signer has run signerKeygen, when `publicKey`
            appears. Absent for dealt keys and the other schemes.
        apiKeyRegistered:
          type: boolean
          description: Whether the engine holds the key id the exchange issued (`register`). True from creation for HMAC keys, whose id the signer carries, and for Hyperliquid, which has none.
        hyperliquid:
          type: object
          description: Hyperliquid keys only. The master wallet's approval of the API wallet.
          required: [approvalStatus]
          properties:
            approvalStatus: { type: string, enum: [pending, approved] }
            approvedAt:
              type: string
              format: date-time
              description: When the engine first saw the master account's approval on the venue.
            validUntil:
              type: string
              format: date-time
              description: When the venue will expire the approval, as the venue reports it.
        withdrawalsDisabled: { type: boolean }
        ipAllowlisted: { type: boolean }
        verification: { $ref: '#/components/schemas/VenueConnectionVerification' }
        expiresAt:
          type: string
          format: date-time
          description: |
            When the key stops working: 100 days after it became active, or
            the venue's own expiry if that comes first (a Hyperliquid
            approval carries the same date). The engine stops signing with it
            then and its status becomes `expired`; the console warns from 7
            days before. Absent until the key is active.
        replaces:
          type: string
          description: The key this one replaces (VenueKeyCreate.replaces), revoked when this one became active.
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    VenueKeyCreate:
      type: object
      required: [connectedAccountId]
      properties:
        connectedAccountId: { type: string }
        replaces:
          type: string
          description: |
            The agent's live key on the same connected account that this one
            replaces. It must be active and not expired, and nothing else may
            be replacing it. It keeps signing until this key becomes active,
            and is revoked then.
        engineShare:
          type: string
          description: |
            The engine's share as `mishmar keygen` printed it (JSON). Required for
            venues with Ed25519 or RSA keys, refused for HMAC venues. For
            venues with ECDSA keys leave it out: the key is made by two-party
            key generation (signerKeygen) and a dealt share is refused.
            Write-only; the agent's share never passes through the engine, and
            the public key is derived from this share.
    VenueKeyRegistration:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 1
          description: The key id the exchange issued when the public key was registered.

    Venue:
      type: string
      enum: [hyperliquid, binance, bybit, okx, coinbase, fireblocks]
    VenueConnectionKind:
      type: string
      enum: [exchange, hyperliquid, cosigner_callback]
      description: |
        An exchange login reached with API keys, a Hyperliquid address (a
        master or one of its sub-accounts), or a custodian's co-signer
        callback. Before contract 0.21.0 this was ConnectedAccountKind.
    ConnectedAccountStatus:
      type: string
      enum: [pending, active, paused, killed]
      description: |
        pending until the account's connection is verified. pause and stop
        are per account.
    ConnectedAccountMode:
      type: string
      enum: [agents_only, shared]
      description: |
        What a fill Mishmar did not place means on a connected account agents
        trade on (`traded`); on one Mishmar only reads it means nothing and
        such fills are simply recorded. Several agents
        may share a connected account in either mode, and transfers, funding, liquidations
        and the venue's other entries are handled the same way in both.
        agents_only (the default): Mishmar is the only thing trading on the
        connected account, so such a fill restricts new risk on the connected account, exits still
        passing, until the owner assigns it (resolveDiscrepancy) or it falls in
        a maintenance window. shared: such a fill is booked to the unassigned book
        and trading continues; account and connected account rules see it, agent rules do not.
    VenueConnection:
      type: object
      required: [id, name, venue, kind, status, venueAccount, connectedAccountIds, setup, createdAt, updatedAt]
      description: |
        One login at a venue, connected with read access: one owner and one
        identifier there (a Hyperliquid master address or one sub-account's,
        a Binance main account or one sub-account, one brokerage account
        number). It is how Mishmar reaches the venue, and it holds one or
        more accounts (ConnectedAccount), which are where the money is. The
        read key, verification and sync are the connection's; balances,
        positions, transactions, value, rules, agents' access and trading
        keys are each account's. The plan counts connections.
      properties:
        id: { type: string }
        name:
          type: string
          description: The person's own name for it, e.g. "Carry".
        venue: { $ref: '#/components/schemas/Venue' }
        kind: { $ref: '#/components/schemas/VenueConnectionKind' }
        status:
          type: string
          enum: [pending, active]
          description: pending until `verify` passes.
        venueAccount: { $ref: '#/components/schemas/VenueAccount' }
        parentId:
          type: string
          description: |
            On a sub-account's connection, the connection of its main
            account, when that is connected too. A main connection does not
            include its sub-accounts: its accounts and its value are the main
            login's alone. The engine keeps it in step as the main login is
            connected or deleted.
        connectedAccountIds:
          type: array
          description: |
            The connection's accounts, in the venue's own order. Fixed by the
            venue and what the engine reads there, and created with the
            connection. A venue that keeps no pools apart, or one the engine
            reads nothing from (a co-signer callback), has one account.
          items: { type: string }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: |
            The connection's value at `equityAsOf`: the sum of its accounts'.
            Absent until the first reading.
        equityAsOf: { type: string, format: date-time }
        unpricedAssets:
          type: array
          description: |
            Assets some account of the connection held at `equityAsOf` that
            the engine had no price for, so `equityUsd` leaves them out.
            Absent when every asset was priced.
          items: { type: string }
        sync:
          type: array
          description: |
            How current each kind of the connection's data is, across its
            accounts. Absent until the connection is verified.
          items: { $ref: '#/components/schemas/SyncState' }
        setup: { $ref: '#/components/schemas/VenueConnectionSetup' }
        verification: { $ref: '#/components/schemas/VenueConnectionVerification' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VenueConnectionRef:
      type: object
      required: [id, name, kind, venueAccount, accountCount, setup]
      description: |
        What an account says about its connection, so that the account alone
        is enough to tell which one it is and, for a signer, how to reach
        the venue. Nothing secret.
      properties:
        id: { type: string }
        name: { type: string }
        accountCount:
          type: integer
          minimum: 1
          description: |
            How many accounts the connection has, whether or not the reader
            was given all of them. An agent given fewer than this sees part
            of the login, and the sum of what it sees is not the
            connection's value. 1 means this account is the whole login.
        kind: { $ref: '#/components/schemas/VenueConnectionKind' }
        venueAccount: { $ref: '#/components/schemas/VenueAccount' }
        parentId: { type: string, description: As on VenueConnection. }
        sync:
          type: array
          description: |
            As on VenueConnection: how current each kind of data is, across
            the connection's accounts. It is how an agent, which reads no
            connection, tells how fresh an account's data is.
          items: { $ref: '#/components/schemas/SyncState' }
        setup: { $ref: '#/components/schemas/VenueConnectionSetup' }
    ConnectedAccountType:
      type: string
      enum: [spot, derivatives, margin, funding, unified, other]
      description: |
        spot: assets held outright (a broker's cash account). derivatives:
        the collateral behind perpetuals and futures, with their positions
        (Hyperliquid's perps, Binance's USDⓈ-M futures). margin: assets
        bought with borrowing (cross or isolated margin, a broker's margin
        account). funding: holds deposits, withdrawals and payments and
        trades nothing. unified: one pool behind every kind of market (a
        unified trading account). other: anything else the venue keeps
        apart.
    ConnectedAccount:
      type: object
      required: [id, venueConnectionId, connection, name, type, venueRef, venue, status, mode, traded, createdAt, updatedAt]
      description: |
        One pool of money at a venue, with its own balances, positions,
        margin and value. The test: moving money between two of them takes a
        transfer. A Binance login has a Spot account and a USDⓈ-M Futures
        account; a Hyperliquid address has Perps and Spot; a brokerage
        account number is one. Every balance, position, transaction and
        equity reading belongs to exactly one, rules are scoped to one, and
        an agent is given one to read or to trade on.

        Accounts are not connected one by one: they come with their venue
        connection (VenueConnection), which holds the read access. The
        engine keeps each account's balances, positions, equity and
        transactions over time. Before contract 0.21.0 a ConnectedAccount
        was the whole login; an account connected before it keeps its id as
        the pool its value measured (USDⓈ-M Futures on Binance, Perps on
        Hyperliquid) and the login's other pools are new accounts. Before
        contract 0.20.0 this was TradingAccount.
      properties:
        id: { type: string }
        venueConnectionId: { type: string }
        connection: { $ref: '#/components/schemas/VenueConnectionRef' }
        name:
          type: string
          description: |
            What the venue calls it: "Spot", "USDⓈ-M Futures", "Perps". On a
            connection with a single account, "Main". Not editable; a person
            names the connection. A line of text for the account is the
            venue, the connection's name, this name and
            `connection.venueAccount.label`.
        type: { $ref: '#/components/schemas/ConnectedAccountType' }
        venueRef:
          type: string
          description: |
            The engine's stable word for the pool at this venue, readable:
            `spot`, `usdm-futures`, `perps`, `main`. Unique within the
            connection.
        venue: { $ref: '#/components/schemas/Venue' }
        status: { $ref: '#/components/schemas/ConnectedAccountStatus' }
        mode: { $ref: '#/components/schemas/ConnectedAccountMode' }
        traded:
          type: boolean
          description: |
            Whether any agent holds an unrevoked trading key on the account.
            False, Mishmar can only read it: every trade there is recorded as
            it is, `mode` restricts nothing and no discrepancy is opened.
        tradable:
          type: boolean
          description: |
            Whether agents can trade on the account through Mishmar (with a
            trading key, or through a custodian's callback). False on an
            account the engine reads but cannot trade yet (Binance Spot,
            Hyperliquid Spot, a Hyperliquid sub-account's): createVenueKey
            there is 409 `conflict`. Absent means true.
        untradableReason:
          type: string
          description: |
            With `tradable` false, one line for a person saying why, without
            the account's name: "Mishmar does not trade spot on Binance
            yet", "Mishmar does not trade a Hyperliquid sub-account yet".
            Absent when the account can be traded.
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: |
            The account's value at `equityAsOf`: its balances at their prices
            plus its positions' unrealised PnL. Absent until the first
            reading.
        equityAsOf: { type: string, format: date-time }
        unpricedAssets:
          type: array
          description: |
            Assets the account held at `equityAsOf` that the engine had no
            price for, so `equityUsd` leaves them out. Absent when every
            asset was priced.
          items: { type: string }
        restrictions:
          type: array
          description: |
            What blocks new risk on the connected account right now, set by the engine
            rather than by a person (pause and stop are `status`). Exits pass
            under every restriction. Absent when there is none.
          items: { $ref: '#/components/schemas/ConnectedAccountRestriction' }
        maintenance: { $ref: '#/components/schemas/MaintenanceWindow' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    VenueAccount:
      type: object
      required: [role]
      description: |
        Which login this is at the venue, in the venue's own terms, so that
        a person or an agent can tell two connections apart without relying
        on the name someone typed.
      properties:
        id:
          type: string
          description: |
            The venue's own identifier for the login: a Hyperliquid address,
            a Binance account's UID, a sub-account's email or address, a
            brokerage account number. Absent until the engine has learnt it
            (verify), and on a venue that gives none (a co-signer callback
            uses its API user id). One venue login connects once.
        role:
          type: string
          enum: [main, subaccount]
          description: |
            On Hyperliquid the venue says which. An exchange's read key does
            not, so an exchange connection is a subaccount when it was
            connected with a `subaccount` name.
        label:
          type: string
          description: |
            `id` shortened for a line of text: `0x12ab…9f3c`, `UID …4471`,
            or a sub-account's own name at the venue.
        parentVenueAccountId:
          type: string
          description: On a sub-account, its main account's `id` at the venue, connected or not.
    AccountValue:
      type: object
      required: [connectedAccountId, equityUsd]
      description: One account's value at a moment, within its connection's.
      properties:
        connectedAccountId: { type: string }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: Its balances at their prices plus its positions' unrealised PnL.
        unpricedAssets:
          type: array
          description: |
            Assets the account held that the engine had no price for at that
            moment, so `equityUsd` leaves them out. Absent when every asset
            was priced.
          items: { type: string }
    MarketKind:
      type: string
      enum: [perp, future, spot, option, equity]
      description: |
        What kind of market a symbol is on. A venue may use one symbol for
        several (Binance's BTCUSDT is a spot pair and a perpetual), so a
        symbol identifies a market only together with this.
    ConnectedAccountRestriction:
      type: object
      required: [scope, cause, since]
      properties:
        scope:
          type: string
          enum: [connected_account, asset]
          description: The whole connected account, or one asset on it (every market that trades that asset).
        asset: { type: string, description: The asset, when `scope` is asset. }
        cause:
          type: string
          enum: [foreign_fill, unexplained_position, ambiguous_transfer, stream_gap, state_unavailable, venue_unreachable]
          description: |
            foreign_fill: an agents-only connected account saw a fill Mishmar did not place.
            unexplained_position: the venue's position in the asset disagrees
            with the books and nothing explains it. ambiguous_transfer: an
            asset several agents hold was transferred out beyond what the unassigned
            book holds. stream_gap: the venue's stream missed more than its
            history can fill. state_unavailable: the venue's state cannot be read.
            venue_unreachable: the engine has no live stream of the connected account's
            fills and orders from the venue: the venue refused the subscription, or the
            stream has been down past its grace. It lifts by itself once the stream is
            back and the engine has caught up.
        since: { type: string, format: date-time }
        discrepancyId: { type: string, description: The discrepancy that lifts it once resolved, when there is one. }
        detail:
          type: string
          description: |
            More than the cause says, when there is more: for venue_unreachable,
            why the stream is down, in the venue's words where it gave any.
    MaintenanceWindow:
      type: object
      required: [openedAt, openedBy]
      description: An open maintenance window (openMaintenance). Absent when none is open.
      properties:
        openedAt: { type: string, format: date-time }
        openedBy: { type: string, description: The operator who opened it. }
        comment: { type: string }
    MaintenanceOpen:
      type: object
      properties:
        comment: { type: string }
    VenueConnectionSetup:
      oneOf:
        - $ref: '#/components/schemas/HyperliquidSetup'
        - $ref: '#/components/schemas/ExchangeSetup'
        - $ref: '#/components/schemas/CosignerCallbackSetup'
      discriminator:
        propertyName: kind
        mapping:
          hyperliquid: '#/components/schemas/HyperliquidSetup'
          exchange: '#/components/schemas/ExchangeSetup'
          cosigner_callback: '#/components/schemas/CosignerCallbackSetup'
    HyperliquidSetup:
      type: object
      required: [kind, network]
      properties:
        kind: { type: string, enum: [hyperliquid] }
        network: { type: string, enum: [mainnet, testnet] }
        subaccountAddress:
          type: string
          description: |
            On a sub-account (`venueAccount.role` subaccount), its own
            address: what the engine reads. `masterAddress` is then the
            master that owns it, whose API wallets trade on it.
        masterAddress:
          type: string
          description: |
            The customer's Hyperliquid master account. Reads need no key: the info
            API is public by address. Each agent's API wallet (its VenueKey) is
            approved by this account. Absent until known: an account added
            without one learns it from the first of its agents' API wallets the
            master approves at Hyperliquid.
    ExchangeSetup:
      type: object
      required: [kind, environment, readKeyRegistered]
      properties:
        kind: { type: string, enum: [exchange] }
        environment:
          type: string
          enum: [demo, live]
          description: Demo trading (what a paper engine creates) or the live venue.
        subaccount: { type: string }
        readKeyRegistered:
          type: boolean
          description: |
            Whether the engine holds the connection's read-only key, for margin,
            positions and fills. The trading keys belong to the agents (VenueKey);
            a connection without a read key verifies and streams nothing.
        readKeyFingerprint: { type: string }
        engineEgressIp:
          type: string
          description: Allowlist this at the venue on every key of the account. Present only when the engine runs in live mode and knows its egress address.
    CosignerCallbackSetup:
      type: object
      required: [kind, callbackUrl, callbackPublicKey]
      properties:
        kind: { type: string, enum: [cosigner_callback] }
        callbackUrl:
          type: string
          description: Register this as the co-signer callback.
        callbackPublicKey: { type: string }
        apiUserId:
          type: string
          description: The Fireblocks API user that maps to this connection.
    VenueConnectionVerification:
      type: object
      required: [checks]
      properties:
        verifiedAt: { type: string, format: date-time }
        checks:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name: { type: string }
              passed: { type: boolean }
              detail: { type: string }
    VenueConnectionCreate:
      type: object
      required: [name, venue]
      properties:
        name: { type: string, minLength: 1 }
        venue: { $ref: '#/components/schemas/Venue' }
        mode:
          $ref: '#/components/schemas/ConnectedAccountMode'
          description: The mode its accounts start in. Default agents_only.
        hyperliquid:
          type: object
          required: [network]
          properties:
            masterAddress:
              type: string
              description: |
                The master account. Absent, the engine learns it from the first
                API wallet an agent gets on one of this connection's accounts that
                the master approves at Hyperliquid (`userRole` names the approving
                account), and verifies the connection then; until that it is pending.
            subaccountAddress:
              type: string
              description: |
                To connect one of the master's sub-accounts: its address.
                `masterAddress` is then required, and verify checks at
                Hyperliquid that the master owns it.
            network:
              type: string
              enum: [mainnet, testnet]
              description: A paper-mode engine accepts testnet only; a live engine accepts mainnet only.
        exchange:
          type: object
          description: |
            An exchange login. The trading keys come later, one per agent
            and account (VenueKey). The read-only key may come later too
            (`setReadKey`): without it the connection is created with
            `readKeyRegistered` false and cannot verify or stream until it has one.
          properties:
            subaccount: { type: string }
            readApiKey:
              type: string
              description: A key with read permissions only, for the account's margin, positions and fills. Write-only.
            readApiSecret:
              type: string
              description: The read-only key's secret (HMAC). Write-only and stored whole; it cannot trade or withdraw.
        fireblocks:
          type: object
          required: [apiUserId]
          properties:
            apiUserId: { type: string }
    VenueConnectionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
    ConnectedAccountUpdate:
      type: object
      properties:
        mode: { $ref: '#/components/schemas/ConnectedAccountMode' }
    ExchangeReadKey:
      type: object
      required: [readApiKey, readApiSecret]
      description: An exchange connection's read-only key, for `setReadKey`. Both write-only.
      properties:
        readApiKey: { type: string, minLength: 1 }
        readApiSecret: { type: string, minLength: 1 }
        subaccount:
          type: string
          description: Replaces the connection's subaccount name when given.
    SyncKind:
      type: string
      enum: [balances, positions, equity, transactions]
    SyncState:
      type: object
      required: [kind, status]
      description: How current one kind of a venue connection's data is, across its accounts.
      properties:
        kind: { $ref: '#/components/schemas/SyncKind' }
        status:
          type: string
          enum: [backfilling, current, behind, failing]
          description: |
            backfilling: reading the account's history for the first time, or
            catching up after a stop. current: read within the plan's freshness. behind: older than that, and catching up.
            failing: the last reads were refused or failed; `error` says why.
        asOf:
          type: string
          format: date-time
          description: The moment the data is complete up to. Absent before the first read.
        historyFrom:
          type: string
          format: date-time
          description: How far back the account's history goes, set by the venue's limit, the plan's retention or the account's first activity.
        lastReadAt: { type: string, format: date-time }
        progress:
          $ref: '#/components/schemas/Decimal'
          description: While backfilling, the share done, 0 to 1.
        error:
          type: string
          description: While failing, one line for a person.
    SnapshotSource:
      type: string
      enum: [observed, rebuilt]
      description: |
        observed: read from the venue at that moment. rebuilt: worked out
        afterwards, for a moment nobody was reading the account (before it
        was connected), by replaying its transactions and, for values in USD,
        the venue's historical prices. No engine rebuilds yet: every reading
        served today is observed.
    Balance:
      type: object
      required: [asset, amount]
      description: |
        One asset the account holds. Before contract 0.21.0 it carried
        `wallet`, a label; the pool is now the account itself.
      properties:
        asset: { type: string, description: 'The asset as the venue names it, e.g. USDC, BTC.' }
        amount: { $ref: '#/components/schemas/Decimal' }
        priceUsd:
          $ref: '#/components/schemas/Decimal'
          description: The price `usdValue` was worked out at. Absent with it.
        usdValue:
          $ref: '#/components/schemas/Decimal'
          description: |
            Absent when the engine has no price for the asset; the
            snapshot's `unpricedAssets` then names it.
    BalanceSnapshot:
      type: object
      required: [connectedAccountId, asOf, source, balances]
      properties:
        connectedAccountId: { type: string }
        asOf: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/SnapshotSource' }
        balances:
          type: array
          items: { $ref: '#/components/schemas/Balance' }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: |
            The account's value at `asOf`: balances at their prices plus
            unrealised PnL. An asset with no price is left out and named in
            `unpricedAssets`.
        unpricedAssets:
          type: array
          description: Assets held at `asOf` with no price. Absent when every asset was priced.
          items: { type: string }
    AccountPosition:
      type: object
      required: [market, symbol, side, size, entryPrice]
      description: |
        The venue's own net position in one market, whoever placed the orders
        behind it. Derivatives only: an asset held outright is a balance.
      properties:
        market: { $ref: '#/components/schemas/MarketKind' }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        size: { $ref: '#/components/schemas/Decimal' }
        entryPrice: { $ref: '#/components/schemas/Decimal' }
        markPrice: { $ref: '#/components/schemas/Decimal' }
        notionalUsd: { $ref: '#/components/schemas/Decimal' }
        unrealizedUsd: { $ref: '#/components/schemas/Decimal' }
        leverage: { $ref: '#/components/schemas/Decimal' }
    AccountPositionSnapshot:
      type: object
      required: [connectedAccountId, asOf, source, positions]
      properties:
        connectedAccountId: { type: string }
        asOf: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/SnapshotSource' }
        positions:
          type: array
          items: { $ref: '#/components/schemas/AccountPosition' }
    AccountTransactionKind:
      type: string
      enum: [trade, transfer_in, transfer_out, funding, fee, liquidation, rebate, other]
      description: |
        transfer_in and transfer_out cross the account's edge: deposits,
        withdrawals, and moves to or from another account. A move between
        two accounts of one connection (Binance Futures to Spot) is a
        transfer_out on the one and a transfer_in on the other, each naming
        the other side (`counterpartConnectedAccountId`); it moves each
        account's value by the amount and the connection's by nothing.
    TransactionOrigin:
      type: object
      required: [kind]
      description: Who placed a trade, so that an agent can tell its own activity from the rest.
      properties:
        kind:
          type: string
          enum: [agent, outside]
          description: |
            agent: an agent placed it through Mishmar. outside: Mishmar did not
            place it: the owner by hand, another program, or the venue itself.
        agentId: { type: string }
        agentName: { type: string }
        decisionId:
          type: string
          description: The decision that allowed it.
        own:
          type: boolean
          description: On the agent-facing reads only. True when the calling agent placed it.
    AccountTransaction:
      type: object
      required: [id, connectedAccountId, kind, at]
      description: |
        One thing that happened on a connected account, as the venue reports
        it. A trade Mishmar placed is here as the venue saw it and, as a
        fill, in its agent's book.
      properties:
        id: { type: string }
        connectedAccountId: { type: string }
        venueId:
          type: string
          description: The venue's own id for it; each is recorded once.
        kind: { $ref: '#/components/schemas/AccountTransactionKind' }
        at: { type: string, format: date-time }
        counterpartConnectedAccountId:
          type: string
          description: |
            On a transfer, the connected account on the other side, when the
            engine can tell: always for a move within one connection, and
            for a move to or from a sub-account whose connection is here
            too. Absent on a deposit or a withdrawal.
        market:
          $ref: '#/components/schemas/MarketKind'
          description: With `symbol`.
        symbol:
          type: string
          description: Trades, funding and liquidations.
        side: { $ref: '#/components/schemas/Side' }
        size: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        asset:
          type: string
          description: What `amount` is in.
        amount:
          $ref: '#/components/schemas/Decimal'
          description: What the account gained (positive) or lost (negative), in `asset`. Transfers, funding, fees, rebates.
        amountUsd: { $ref: '#/components/schemas/Decimal' }
        feeUsd:
          $ref: '#/components/schemas/Decimal'
          description: A trade's fee.
        origin:
          $ref: '#/components/schemas/TransactionOrigin'
          description: Trades and liquidations. Absent on the rest.
    AccountTransactionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccountTransaction' }
        nextCursor: { type: string }
    EquityResolution:
      type: string
      enum: [minute, hour, day]
    EquityPoint:
      type: object
      required: [at, equityUsd, source]
      properties:
        at: { type: string, format: date-time }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: The account's value at that moment.
        source: { $ref: '#/components/schemas/SnapshotSource' }
    EquitySeries:
      type: object
      required: [connectedAccountId, resolution, points]
      properties:
        connectedAccountId: { type: string }
        resolution: { $ref: '#/components/schemas/EquityResolution' }
        points:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/EquityPoint' }
    VenueConnectionEquityPoint:
      type: object
      required: [at, equityUsd, accounts]
      properties:
        at: { type: string, format: date-time }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: The sum of `accounts`.
        accounts:
          type: array
          description: Each account's value in that reading, in the connection's order.
          items: { $ref: '#/components/schemas/AccountValue' }
    VenueConnectionEquitySeries:
      type: object
      required: [venueConnectionId, resolution, points]
      description: |
        Starts at the first reading that covered every account of the
        connection: for a login connected before contract 0.21.0, at the
        upgrade.
      properties:
        venueConnectionId: { type: string }
        resolution: { $ref: '#/components/schemas/EquityResolution' }
        points:
          type: array
          items: { $ref: '#/components/schemas/VenueConnectionEquityPoint' }
    AccessLogRead:
      type: string
      enum: [accounts, balances, positions, transactions, equity]
    AccessLogEntry:
      type: object
      required: [id, at, agentId, agentName, read]
      description: One read of connected-account data by an agent.
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        agentId: { type: string }
        agentName: { type: string }
        keyId:
          type: string
          description: The agent key the read was signed with.
        connectedAccountId:
          type: string
          description: Absent for `accounts`, the agent's list of what it was given.
        read: { $ref: '#/components/schemas/AccessLogRead' }
        from:
          type: string
          format: date-time
          description: The start of the range asked for, or the moment for a snapshot.
        to: { type: string, format: date-time }
    AccessLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessLogEntry' }
        nextCursor: { type: string }
    AccountDataEntitlements:
      type: object
      required: [history, retentionDays]
      description: |
        What the plan includes of connected-account data. The values come from
        the plan file, not from code. The data is collected by polling, whether
        or not the engine that judges orders is up: on the hosted service a
        collector stays up for an account whose engine was stopped for being
        quiet, until the account is released.
      properties:
        history:
          type: boolean
          description: |
            True, a reading of each connected account's positions, balances and
            value is kept per stretch of `resolutionSeconds`, and they are
            served over time and at a past moment. False, only the latest
            reading is kept, and those reads are refused with `limit_reached`.
        resolutionSeconds:
          type: integer
          minimum: 60
          description: How often each connected account is read, and the stretch one stored reading stands for. Absent means 60.
        retentionDays:
          type: integer
          minimum: 1
          description: How long snapshots and transactions are kept and served.
        includedStorageMb:
          type: integer
          minimum: 1
          description: The stored data the plan includes; beyond it is charged for. Absent means not metered.
    DataUsage:
      type: object
      required: [storageBytes, asOf]
      properties:
        storageBytes:
          type: integer
          format: int64
          description: What the account's connected-account data takes in the engine's database.
        includedBytes:
          type: integer
          format: int64
          description: From `Entitlements.accountData.includedStorageMb`. Absent when not metered.
        asOf: { type: string, format: date-time }
    VenueRules:
      type: object
      required: [connectedAccountId, venue, asOf, symbols]
      properties:
        connectedAccountId: { type: string }
        venue: { $ref: '#/components/schemas/Venue' }
        asOf:
          type: string
          format: date-time
          description: When the engine last read the rules from the venue.
        symbols:
          type: array
          items: { $ref: '#/components/schemas/SymbolRules' }
    SymbolRules:
      type: object
      required: [symbol]
      description: |
        One market's rules as the venue states them. Fields the venue does not
        state are absent. Hyperliquid states no tick: a perp price has at most
        five significant figures and at most (6 - sizeDecimals) decimals, and
        any integer price is valid.
      properties:
        symbol: { type: string }
        tickSize: { $ref: '#/components/schemas/Decimal' }
        stepSize: { $ref: '#/components/schemas/Decimal' }
        minSize: { $ref: '#/components/schemas/Decimal' }
        minNotional: { $ref: '#/components/schemas/Decimal' }
        maxLeverage: { $ref: '#/components/schemas/Decimal' }
        assetIndex:
          type: integer
          description: Hyperliquid only. The asset's index, which orders name instead of the symbol.
        sizeDecimals:
          type: integer
          description: Hyperliquid only. Decimals a size may have.
    WalletApprovalRequest:
      type: object
      properties:
        walletChainId:
          type: string
          description: |
            The chain the browser wallet is connected to, as the wallet reports it
            (hex, e.g. "0x66eee"). Some wallets refuse typed data for another chain;
            Hyperliquid accepts any chain id in the signature domain.
    WalletApproval:
      type: object
      required: [approvalId, typedData, expiresAt]
      properties:
        approvalId:
          type: string
          description: Correlates the signature with this typed data. Single use.
        typedData:
          type: object
          additionalProperties: true
          description: EIP-712 typed data (domain, types, primaryType, message) for the wallet's signTypedData call.
        expiresAt: { type: string, format: date-time }
    WalletApprovalSignature:
      type: object
      required: [approvalId, signature]
      properties:
        approvalId: { type: string }
        signature:
          type: string
          description: The 65-byte hex signature the master wallet produced, 0x-prefixed.

    RuleMetric:
      type: string
      enum: [gross_exposure, net_exposure, leverage, concentration, drawdown, daily_loss, daily_realized_loss, order_size]
      description: |
        gross_exposure, net_exposure, daily_loss, daily_realized_loss, order_size are in USD.
        leverage is a ratio. concentration and drawdown are percentages.
        net_exposure is the size of the net position whichever way it points (the absolute
        value of the signed sum), so a short past the cap breaches it like a long.
        order_size, and the projected book every exposure metric reads, value an order at the
        higher of its price and the market: a sell priced under the market fills at the market.
        Proposal.notionalUsd stays size × price; the evaluation's observed value is what was judged.
        leverage is gross exposure ÷ equity at account and connected account scope, and
        gross exposure ÷ the portfolio's allocated capital (Portfolio.capitalUsd) at
        portfolio and agent scope, where drawdown is measured against that capital too;
        a portfolio without capital cannot have such rules (createRule).
        net_exposure and concentration accept an `asset` to narrow to one name.
        daily_loss is today's loss counting open positions at their marks
        (PnlTotals.netUsd); daily_realized_loss counts only what was closed,
        with fees and funding (PnlTotals.realizedNetUsd).
    RuleUnit:
      type: string
      enum: [usd, ratio, pct]
    RuleOutcome:
      type: string
      enum: [allow, require_approval, block]
      description: What happens when the threshold is breached. `allow` records the breach and lets it through.
    Rule:
      type: object
      required: [id, name, scope, metric, threshold, unit, outcome, enabled, appliesToExits, revision, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        metric: { $ref: '#/components/schemas/RuleMetric' }
        threshold: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/RuleUnit' }
        asset:
          type: string
          description: Narrow the metric to one asset, e.g. `NVDA` or `BTC`.
        outcome: { $ref: '#/components/schemas/RuleOutcome' }
        enabled: { type: boolean }
        appliesToExits:
          type: boolean
          description: |
            Whether the rule also judges exits (see submitProposal). False by
            default: the rule is waived for an exit, and the waiver is recorded
            on the decision's evaluation. Set it for a rule that must hold even
            while an agent closes, an order-size cap on a thin market, say.
        revision:
          type: integer
          description: The configuration revision that last changed this rule.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RuleCreate:
      type: object
      required: [name, scope, metric, threshold, unit, outcome]
      properties:
        name: { type: string, minLength: 1 }
        scope: { $ref: '#/components/schemas/Scope' }
        metric: { $ref: '#/components/schemas/RuleMetric' }
        threshold: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/RuleUnit' }
        asset: { type: string }
        outcome: { $ref: '#/components/schemas/RuleOutcome' }
        enabled: { type: boolean, default: true }
        appliesToExits: { type: boolean, default: false }
    RuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        scope: { $ref: '#/components/schemas/Scope' }
        metric: { $ref: '#/components/schemas/RuleMetric' }
        threshold: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/RuleUnit' }
        asset: { type: string }
        outcome: { $ref: '#/components/schemas/RuleOutcome' }
        enabled: { type: boolean }
        appliesToExits: { type: boolean }

    Verdict:
      type: string
      enum: [allow, require_approval, block]
    ProposalKind:
      type: string
      enum: [order, transaction, signed_message, cancel]
      description: |
        cancel pulls a resting order the agent placed through Mishmar, named by
        `targetClientOrderId`; it carries no order fields.
    Side:
      type: string
      enum: [buy, sell]
    Proposal:
      type: object
      required: [kind, venue, symbol, side, size, orderType, reduceOnly, notionalUsd, clientOrderId, expiresAt]
      description: |
        The proposal as the engine priced it. For a cancel, the order fields
        (side, size, price, orderType, reduceOnly) describe the order being
        cancelled as its own decision recorded it, and notionalUsd is "0": a
        cancel adds no exposure.
      properties:
        kind: { $ref: '#/components/schemas/ProposalKind' }
        venue: { $ref: '#/components/schemas/Venue' }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        size: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        orderType: { type: string, enum: [market, limit] }
        leverage: { $ref: '#/components/schemas/Decimal' }
        reduceOnly: { type: boolean }
        notionalUsd: { $ref: '#/components/schemas/Decimal' }
        clientOrderId:
          type: string
          description: Assigned by the engine. Names the agent so fills attribute per agent on a shared account.
        expiresAt:
          type: string
          format: date-time
          description: The deadline the agent set (ProposalSubmit.expiresAt). Nothing is forwarded past it.
        targetClientOrderId:
          type: string
          description: Cancels only. The clientOrderId of the order being cancelled.
        targetDecisionId:
          type: string
          description: Cancels only. The decision that placed the order being cancelled.
    RuleEvaluation:
      type: object
      required: [ruleId, ruleName, scope, metric, observed, threshold, unit, passed, outcome]
      properties:
        ruleId: { type: string }
        ruleName: { type: string }
        scope: { $ref: '#/components/schemas/Scope' }
        metric: { $ref: '#/components/schemas/RuleMetric' }
        observed:
          $ref: '#/components/schemas/Decimal'
          description: The metric's value after the proposal, as evaluated.
        threshold: { $ref: '#/components/schemas/Decimal' }
        unit: { $ref: '#/components/schemas/RuleUnit' }
        passed: { type: boolean }
        outcome: { $ref: '#/components/schemas/RuleOutcome' }
        waived:
          type: boolean
          description: |
            True when the order is an exit and the rule does not apply to exits.
            The rule is still evaluated and `observed` and `passed` recorded, so
            the ledger shows what was skipped, but a waived evaluation never
            affects the verdict. Absent when the rule applied.
        waivedReason:
          type: string
          description: Why the rule was waived, for a person, e.g. "exit of 0.5 BTC; the rule does not apply to exits".
    StateSnapshot:
      type: object
      required: [asOf, grossExposureUsd, netExposureUsd, leverage, drawdownPct, dailyPnlUsd]
      properties:
        asOf: { type: string, format: date-time }
        grossExposureUsd: { $ref: '#/components/schemas/Decimal' }
        netExposureUsd: { $ref: '#/components/schemas/Decimal' }
        leverage: { $ref: '#/components/schemas/Decimal' }
        drawdownPct: { $ref: '#/components/schemas/Decimal' }
        dailyPnlUsd: { $ref: '#/components/schemas/Decimal' }
    VenueAck:
      type: object
      required: [orderId, status, receivedAt]
      properties:
        orderId: { type: string }
        status: { type: string }
        receivedAt: { type: string, format: date-time }
        clientOrderId:
          type: string
          description: >-
            The id the venue indexed the order under when it is not the proposal's own
            clientOrderId (Hyperliquid derives a 16-byte cloid from it). Fills the venue
            reports under it are attributed to this decision, also after the engine restarts.
    Decision:
      type: object
      required: [id, createdAt, agentId, agentName, portfolioId, connectedAccountId, verdict, proposal, evaluations, state, configRevision, latencyMs, agentSignature]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        agentId: { type: string }
        agentName: { type: string }
        portfolioId: { type: string }
        connectedAccountId: { type: string }
        signingVersion:
          type: integer
          enum: [1, 2]
          description: |
            Which shape the agent's and the engine's signatures on this
            decision cover. 2: this contract's, the account's id under
            `connectedAccountId`. 1: a decision from before contract 0.20.0,
            whose signed bytes carry the same id under `tradingAccountId`; the
            record is served under today's names, and a verifier rebuilds the
            bytes with the old name. Absent means 1.
        verdict: { $ref: '#/components/schemas/Verdict' }
        reason:
          type: string
          description: One line for a person, e.g. the rule that blocked it or the kill switch that was engaged.
        proposal: { $ref: '#/components/schemas/Proposal' }
        exit:
          type: boolean
          description: |
            True when the engine judged the order an exit (see submitProposal):
            every rule without appliesToExits was waived. Absent otherwise.
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/RuleEvaluation' }
        state: { $ref: '#/components/schemas/StateSnapshot' }
        configRevision: { type: integer }
        latencyMs: { type: number, format: double }
        agentSignature: { type: string }
        engineSignature:
          type: string
          description: |
            The engine key's Ed25519 signature over the decision record as written
            (every field above plus `submission`, without `venueAck`, `approval`,
            `signing` and this field), base64. Present on every decision. See
            docs/ledger.md.
        venueAck: { $ref: '#/components/schemas/VenueAck' }
        approvalId: { type: string }
        submission:
          $ref: '#/components/schemas/DecisionSubmission'
        approval:
          $ref: '#/components/schemas/ApprovalOutcome'
          description: The approval's outcome, when the decision was parked for a person.
        signing:
          $ref: '#/components/schemas/SigningStatus'
          description: |
            Where the order stands with the agent's signer. Absent on connected accounts that
            need no signer (the paper simulator, co-signer callbacks).
        cancellation:
          $ref: '#/components/schemas/OrderCancellation'
          description: |
            How the order left the venue's book without filling completely, once the
            engine knows (the `cancelled` ledger event). Absent while it rests, after it
            filled completely, and on orders that never rested. Not covered by
            engineSignature: it arrives later, as a chained event.
        valuation:
          $ref: '#/components/schemas/DecisionValuation'
          description: |
            What the rules valued the order at and where that price came from. Present
            on orders; absent on cancels and on decisions from before it was recorded.
            Not covered by engineSignature.
    DecisionValuation:
      type: object
      required: [price, source]
      description: |
        The price the rules valued the order at (the `order_size` metric and the
        projected book), which is the highest of the order's own price, the symbol's
        mark and what the engine knows it could fill at beyond both. For a market
        order that is not reduce-only the engine fetches the venue's order book and
        walks 105% of the order's size through it on the order's side: the worst
        price reached is the valuation, and on Hyperliquid the bound the order is
        sent with when it is tighter than the slippage bound. Exits (reduce-only)
        keep the mark. See docs/rules.md in the engine, "Pricing the proposal".
      properties:
        price: { $ref: '#/components/schemas/Decimal' }
        source:
          type: string
          enum: [limit, mark, mark_slippage, book, one_shot]
          description: |
            limit: the order's own price was the highest. mark: the symbol's mark.
            mark_slippage: the mark moved by the venue's market-order slippage (a market
            buy where no book was read). book: the worst price of the walk through the
            venue's order book. one_shot: the price in the agent's one-shot venue message.
        bookPrice:
          $ref: '#/components/schemas/Decimal'
          description: >-
            The worst price the walk through the book reached, before it is compared with
            the order's price and the mark (a market sell walks below the mark, and the
            rules still value it at the mark). The IOC bound the order is sent with (on
            Hyperliquid its IOC limit, on Binance a LIMIT IOC) is tightened to it. Present
            whenever a book was walked.
        bookShort:
          type: boolean
          description: >-
            True when the book held less than 105% of the order's size: the last level's
            price was used and the real fill could be worse. Only when a book was walked.
        bookLevels:
          type: integer
          description: How many price levels of the book the walk consumed. Only when a book was walked.
        bookAsOf:
          type: string
          format: date-time
          description: When the venue's book snapshot was taken. Only when a book was walked.
        detail:
          type: string
          description: >-
            Why the book was not used when a market order was valued without one: the
            venue's error, a stale book, or an adapter that cannot read books. One line.
    OrderCancellation:
      type: object
      required: [at, by, filledSize]
      description: |
        The end of a resting order that did not fill completely. Each order has at
        most one.
      properties:
        at:
          type: string
          format: date-time
          description: When the venue took it off the book, or when the engine learned it did.
        by:
          type: string
          enum: [agent, venue, outside, unknown]
          description: |
            agent: a cancel the agent proposed through Mishmar (`cancelDecisionId`).
            venue: the venue pulled it itself (expiry, margin, reduce-only, self-trade,
            delisting, liquidation, …; `venueStatus` says which). outside: cancelled at
            the venue but not through Mishmar, by the owner in the venue's app or another
            key. unknown: it left the venue's list of open orders with no status the
            engine could read and no fill to explain it.
        cancelDecisionId:
          type: string
          description: Present when by is agent. The decision of the cancel.
        filledSize:
          $ref: '#/components/schemas/Decimal'
          description: How much of the order filled before it left the book; "0" when none did.
        venueStatus:
          type: string
          description: The venue's own word for it when it gave one, e.g. Hyperliquid's `marginCanceled` or Binance's `EXPIRED`.
    DecisionSubmission:
      type: object
      required: [keyId, nonce, proposedAt]
      description: |
        What the agent submitted that the priced proposal does not keep, so the
        agent's signature can be verified again from the ledger alone: the key,
        the nonce, the submission time, the price as sent (absent for a market
        order, whose stored price is the mark the engine used) and the
        one-shot venue message when there was one. A cancel's target is on the
        proposal (`targetClientOrderId`).
      properties:
        keyId: { type: string }
        nonce: { type: string }
        proposedAt: { type: string, format: date-time }
        price: { $ref: '#/components/schemas/Decimal' }
        venueMessage: { $ref: '#/components/schemas/ProposalVenueMessage' }
    ApprovalOutcome:
      type: object
      required: [id, status, requestedAt, expiresAt]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        comment: { type: string }
    LedgerHead:
      type: object
      required: [seq, hash, events, enginePublicKey]
      properties:
        seq:
          type: integer
          format: int64
          description: The latest event's sequence number; 0 when the chain is empty.
        hash: { type: string, description: The latest event's hash, hex; empty when the chain is empty. }
        events: { type: integer, format: int64 }
        enginePublicKey:
          type: string
          description: The engine key's Ed25519 public key, base64. Verifies every engineSignature.
    LedgerEvent:
      type: object
      required: [seq, at, kind, payload, prevHash, hash]
      description: |
        One append-only entry of the audit ledger. `hash` is SHA-256 over the previous
        event's hash, a newline and the canonical JSON of `payload` (keys sorted, no
        whitespace, nulls dropped), hex; the first event's prevHash is empty. The
        kinds: decision (the record as written), forwarded (reason, venue ack, fills
        the venue returned; a cancel's own answer too), fills (fills a venue stream
        reported), parked, approval (the outcome), expired (approvals nobody decided
        in time), cancelled (an order Mishmar placed left the venue's book without
        filling completely, written once against the decision that placed it; the
        payload is that decision's OrderCancellation plus `decisionId` and
        `clientOrderId`), capital (a transfer in or out, valued at the
        mark), venue_event (funding, a liquidation or auto-deleveraging, a
        settlement, a rebate, interest and the venue's other non-trade entries, with
        how they were booked), discrepancy (one opened), resolved (one resolved, and
        how), reassigned (a position moved between books), maintenance (a window
        opened or closed).
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind:
          type: string
          enum: [decision, forwarded, fills, parked, approval, expired, cancelled, capital, venue_event, discrepancy, resolved, reassigned, maintenance]
        decisionId: { type: string }
        payload:
          type: object
          additionalProperties: true
        prevHash: { type: string }
        hash: { type: string }
    LedgerEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerEvent' }
        nextAfter:
          type: integer
          format: int64
          description: Pass as `after` for the next page; absent on the last page.
    DecisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Decision' }
        nextCursor: { type: string }

    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    Approval:
      type: object
      required: [id, decisionId, status, requestedAt, expiresAt, decision]
      properties:
        id: { type: string }
        decisionId: { type: string }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        comment: { type: string }
        decision: { $ref: '#/components/schemas/Decision' }
        now:
          $ref: '#/components/schemas/ApprovalEvaluation'
          description: |
            The parked proposal evaluated again against the account as it is at the
            time of the read: present on a pending approval read one at a time
            (GET /approvals/{approvalId}), absent on decided and expired approvals and
            on the list. The decision's own `evaluations` are what was true when the
            proposal was parked.
    ApprovalEvaluation:
      type: object
      required: [evaluatedAt, verdict, evaluations, state, revision]
      description: |
        The rules re-run for a pending approval: the verdict the proposal would get
        if it were submitted now, each rule's observed value and threshold against
        the current book (with the orders in flight and resting), marks, PnL,
        statuses and restrictions, the account-level numbers before the proposal,
        and a `revision` of the outcome.
      properties:
        evaluatedAt: { type: string, format: date-time }
        verdict:
          $ref: '#/components/schemas/Verdict'
          description: >-
            allow or require_approval: the approver may co-sign. block: a rule, status or
            restriction refuses it now, and approve answers 409 until that changes.
        reason:
          type: string
          description: One line for a person, as on a decision; absent when allowed cleanly.
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/RuleEvaluation' }
        state: { $ref: '#/components/schemas/StateSnapshot' }
        valuation:
          $ref: '#/components/schemas/DecisionValuation'
          description: What the order was valued at for this evaluation (the current mark; a market order's book is not read again).
        revision:
          type: string
          description: |
            A hash of the outcome: the verdict, the reason and each rule's id, pass or
            fail, outcome and waiver. The observed values move with the market and are
            not in it, so a drift that flips no rule keeps the revision. Send it with the
            approve (ApprovalDecide.revision); a different revision at that moment is
            409 `evaluation_changed`.
    ApprovalDecide:
      type: object
      properties:
        comment: { type: string }
        revision:
          type: string
          description: |
            The `revision` of the `now` evaluation the approver saw (Approval.now). The
            engine evaluates once more as it approves: a different revision is refused
            with 409 `evaluation_changed` and the current `now` in `details.now`, so the
            approver confirms what is true now. Absent, only a `block` now refuses.

    ProposalSubmit:
      type: object
      required: [keyId, connectedAccountId, kind, symbol, nonce, proposedAt, expiresAt, signature]
      description: |
        Every kind but cancel needs side, size, orderType and reduceOnly; a
        cancel needs targetClientOrderId and must leave the order fields
        (side, size, price, orderType, leverage, reduceOnly) out. The engine
        refuses either mistake (422).
      properties:
        keyId:
          type: string
          description: The id returned when the key was issued.
        connectedAccountId:
          type: string
          description: |
            The connected account to trade on. Part of the signed bytes under
            this name since contract 0.20.0 (before, `tradingAccountId`): a
            client built for an earlier contract is refused with 422.
        kind: { $ref: '#/components/schemas/ProposalKind' }
        symbol:
          type: string
          description: For a cancel, the symbol of the order being cancelled; the venues need it.
        side:
          $ref: '#/components/schemas/Side'
          x-go-type-skip-optional-pointer: true
        size:
          $ref: '#/components/schemas/Decimal'
          x-go-type-skip-optional-pointer: true
        price:
          $ref: '#/components/schemas/Decimal'
          description: Required for limit orders. Ignored for market orders, which are priced at mark.
        orderType:
          type: string
          enum: [market, limit]
          x-go-type-skip-optional-pointer: true
        leverage: { $ref: '#/components/schemas/Decimal' }
        reduceOnly:
          type: boolean
          description: |
            The agent's claim that the order only reduces its position. With it
            the signer sets the venue's own reduce-only flag, and the engine
            judges whether the order is an exit (see submitProposal).
        targetClientOrderId:
          type: string
          description: |
            Cancels only, and required for them: the clientOrderId the engine
            assigned on the decision of the order to pull. That order must be
            the same agent's, on the same connected account, and must have reached the
            venue. Refused on every other kind.
        venueMessage: { $ref: '#/components/schemas/ProposalVenueMessage' }
        nonce:
          type: string
          description: Unique per proposal. A replayed nonce is rejected.
        proposedAt:
          type: string
          format: date-time
          description: Rejected when more than 60 seconds old.
        expiresAt:
          type: string
          format: date-time
          description: |
            The latest moment the order may reach the venue. Must be after
            proposedAt and at most 24 hours later. A decision parked for a
            person expires then (sooner when the engine's approval window is
            shorter), an approval after it is refused, and nothing is forwarded
            past it. A proposal that is already past it is refused (422).
        signature:
          type: string
          description: |
            Base64 Ed25519 signature over the canonical JSON of every other
            field in this object: keys sorted at every level (venueMessage
            included), no whitespace, numbers as the shortest round-trip
            decimal, absent optional fields omitted. Pinned in
            spec/vectors/proposal-signing.json.
    ProposalVenueMessage:
      type: object
      required: [venueKeyId, scheme, message, engineCommitmentId, share]
      description: |
        The one-shot path. The agent's signer builds the venue request and
        signs its half before the proposal leaves the agent's machine, so an
        allowed order needs no round trip to the signer: the engine decodes
        `message`, checks it against the proposal and the connected account's venue rules,
        runs the rules, and only then adds its own half and forwards. It is
        inside the signed proposal, so nobody can pair a proposal with a
        message the agent did not mean. The engine spends the commitment named
        here whatever the outcome: it signs with it when the order is allowed
        and discards it on a block, a park or a refusal. A parked order is
        signed again through the signer channel once a person decides, since
        this message would be stale by then. Without this field the engine
        asks the signer through the channel.
      properties:
        venueKeyId:
          type: string
          description: The agent's trading key on the connected account.
        scheme:
          $ref: '#/components/schemas/SigningScheme'
          description: |
            frost-ed25519 (Binance) or ecdsa-2p (Hyperliquid, its half from a
            presigned slot, signerPresign). Never proxy: an HMAC venue's signer
            holds the whole key and forwards the request itself.
        message:
          type: string
          description: |
            Base64 of the venue request before its signature: Binance's
            parameter string (with its timestamp and recvWindow), which is what
            its signature covers; Hyperliquid's action and nonce as the
            exchange endpoint takes them, plus the order's Mishmar client
            order id, which the cloid on the order is derived from and the
            venue never sees: `{"action": …, "nonce": …, "clientOrderId": …}`,
            no vault, built by the signer from the connected account's venue
            rules, from which the engine derives the EIP-712 digest itself.
        engineCommitmentId:
          type: string
          description: The engine commitment (requestCommitments) or presigned slot (signerPresign) this half was computed against. Single use.
        commitment:
          type: string
          description: Base64. FROST only, the signer's own nonce commitment.
        share:
          type: string
          description: |
            Base64. The signer's half: its FROST signature share, or for
            two-party ECDSA the protocol's last message, which proves itself
            against the slot and the message's digest, so it cannot be moved
            to another slot or another order.
    CommitmentRequest:
      type: object
      required: [venueKeyId]
      properties:
        venueKeyId: { type: string }
        count:
          type: integer
          minimum: 1
          description: How many the signer wants. Default and cap, the entitlement less what it already holds unused.
    CommitmentBatch:
      type: object
      required: [venueKeyId, scheme, engineInstance, batchSize, outstanding, items]
      properties:
        venueKeyId: { type: string }
        engineInstance:
          type: string
          description: |
            The engine instance that issued the batch; it changes each time
            the engine starts. The engine keeps the secret half of each
            commitment in memory only (written down, a restored backup could
            sign two messages with one nonce and give the engine's key share
            away), so after a restart the batch is unknown to it and a
            proposal using one is refused with 409. The signer poll names the
            current instance, so a signer drops a stale batch before it
            proposes with it.
        scheme: { $ref: '#/components/schemas/SigningScheme' }
        batchSize:
          type: integer
          description: The account's entitlement (Entitlements.commitmentBatch).
        outstanding:
          type: integer
          description: Unused commitments the signer holds for this key, these included.
        items:
          type: array
          items: { $ref: '#/components/schemas/EngineCommitment' }
    EngineCommitment:
      type: object
      required: [id, expiresAt]
      description: |
        One single-use engine nonce: a FROST commitment the signer computes
        against, or a presigned two-party ECDSA slot.
      properties:
        id: { type: string }
        commitment:
          type: string
          description: Base64. FROST only, the engine's nonce commitment; a two-party ECDSA slot carries nothing, since the signer's own presignature holds its side.
        expiresAt: { type: string, format: date-time }
    KeygenRound:
      type: object
      required: [venueKeyId, round]
      description: One round of two-party key generation from the agent's signer (signerKeygen).
      properties:
        venueKeyId: { type: string }
        round:
          type: integer
          enum: [1, 2]
        sessionId:
          type: string
          description: Round 2. The session round 1 opened.
        message:
          type: string
          description: Round 2. Base64, the signer's protocol message answering the engine's first.
    KeygenRoundResult:
      type: object
      required: [sessionId, round, message]
      description: Key generation agrees its own session id inside the protocol; only presigning takes the joint one.
      properties:
        sessionId: { type: string }
        round: { type: integer }
        message:
          type: string
          description: Base64, the engine's protocol message for the round.
        publicKey:
          type: string
          description: Round 2. The joint public key, compressed SEC1 as base64, which the signer checks against its own.
        address:
          type: string
          description: Round 2. The joint key's EVM address, now recorded as VenueKey.publicKey.
    PresignRound:
      type: object
      required: [venueKeyId, round]
      description: One round of presigning from the agent's signer (signerPresign).
      properties:
        venueKeyId: { type: string }
        round:
          type: integer
          enum: [1, 2]
        sessionId:
          type: string
          description: Round 2. The session round 1 opened.
        count:
          type: integer
          minimum: 1
          description: Round 1. How many nonces the signer wants. Default and cap, the entitlement less what it already holds unused.
        signerSid:
          type: string
          description: |
            Round 1. Base64 of 16 random bytes, the signer's half of the
            session id. The engine adds 16 of its own, and both sides run the
            protocol under SHA-256 of the signer's half then the engine's.
        message:
          type: string
          description: Round 2. Base64, the signer's protocol message answering the engine's first.
    PresignRoundResult:
      type: object
      required: [sessionId, round, message, engineInstance]
      properties:
        sessionId: { type: string }
        round: { type: integer }
        engineSid:
          type: string
          description: Round 1. Base64 of the engine's 16 bytes of the session id.
        count:
          type: integer
          description: Round 1. How many nonces the session makes, after the entitlement's cap.
        message:
          type: string
          description: Base64, the engine's protocol message for the round.
        engineInstance:
          type: string
          description: As CommitmentBatch.engineInstance; it changes when the engine or the signer behind it restarts, and the slots are gone with it.
        batchSize:
          type: integer
          description: Round 2. The account's entitlement (Entitlements.commitmentBatch).
        outstanding:
          type: integer
          description: Round 2. Unused slots the signer holds for this key, these included.
        slots:
          type: array
          description: Round 2. One per nonce, in the order of the signer's own presignature.
          items: { $ref: '#/components/schemas/EngineCommitment' }
    SigningScheme:
      type: string
      enum: [frost-ed25519, ecdsa-2p, rsa-2p, proxy]
      description: The protocol a sign request runs, decided by the venue key's scheme (VenueKeyScheme), never chosen by anyone.
    SignerPoll:
      type: object
      properties:
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 25
          description: How long the engine may hold the poll open waiting for something to sign.
    SignRequest:
      type: object
      required: [id, sessionId, round, agentId, connectedAccountId, venueKeyId, venue, scheme, purpose, message, issuedAt, expiresAt, attempt]
      properties:
        id:
          type: string
          description: Unique per request; the answer names it.
        sessionId:
          type: string
          description: Groups the rounds of one signature. A one-round scheme has one request per session.
        round: { type: integer, minimum: 1 }
        agentId: { type: string }
        connectedAccountId: { type: string }
        venueKeyId:
          type: string
          description: The agent's trading key on the connected account, so the signer picks the right share.
        venue: { $ref: '#/components/schemas/Venue' }
        scheme: { $ref: '#/components/schemas/SigningScheme' }
        purpose:
          type: string
          enum: [order, cancel, verify]
          description: |
            What the signature is for. `order` and `cancel` carry the decision
            and the agent's proposal; `verify` is the harmless read the engine
            co-signs to prove the key (verifyVenueKey), and carries neither.
            A signer refuses an `order` it did not propose; it may sign a
            `verify` whose message decodes to no order at all.
        decisionId: { type: string }
        clientOrderId: { type: string }
        order: { $ref: '#/components/schemas/SignRequestOrder' }
        message:
          type: string
          description: |
            Base64 of the exact bytes the venue will verify: Binance's parameter
            string, Hyperliquid's EIP-712 digest. The signer decodes them itself
            and checks them against the order it proposed; `order` is a courtesy,
            never the thing checked. A digest cannot be decoded, so a
            two-party ECDSA request also carries the action and nonce it was
            computed from in `venueRequest.body`, and the signer recomputes
            the digest from them before it signs.
        proposal:
          $ref: '#/components/schemas/ProposalSubmit'
          description: |
            The agent's own signed proposal this request serves (orders and
            cancels), so a signer that is not the proposer (a standalone signer,
            a proxy) can verify that the agent authorized the order before it
            signs. Absent for `verify`.
        engine: { $ref: '#/components/schemas/SignRequestEngine' }
        venueRequest: { $ref: '#/components/schemas/VenueRequest' }
        issuedAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            Seconds after `issuedAt` for a fresh proposal. For an order signed
            again after a person approved it, the grace period, capped by the
            proposal's own deadline.
        attempt:
          type: integer
          minimum: 1
          description: Increments each time the request is handed out again after a signer took it and did not answer.
    SignRequestOrder:
      type: object
      required: [symbol, side, size, orderType, reduceOnly]
      properties:
        symbol: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        size:
          $ref: '#/components/schemas/Decimal'
          description: As the venue will receive it, after rounding to its step.
        price: { $ref: '#/components/schemas/Decimal' }
        orderType: { type: string, enum: [market, limit] }
        reduceOnly: { type: boolean }
    SignRequestEngine:
      type: object
      description: The engine's part of the round.
      properties:
        commitment:
          type: string
          description: Base64. The engine's FROST nonce commitment for this signature.
        signature:
          type: string
          description: |
            Base64 Ed25519 signature by the engine's key (see getLedgerHead)
            over `message`. Present for the proxy scheme: the proxy forwards
            nothing that does not carry it.
        payload:
          type: string
          description: Base64. Round data for the two-party ECDSA and RSA schemes.
    VenueRequest:
      type: object
      required: [method, url]
      description: |
        The venue request the signature serves. For the proxy scheme it is the
        request the proxy signs with the key it holds and sends to the venue;
        for the others it is informational (an exchange signs its query string,
        which does not name the endpoint, so this says what the engine will call).
      properties:
        method: { type: string }
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        body:
          type: string
          description: Base64.
    SignerAnswer:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [share, signature, venue_response, refusal]
          description: Must fit the request's scheme; `share` for FROST, ECDSA and RSA rounds, `venue_response` for the proxy.
        commitment:
          type: string
          description: Base64. The signer's FROST nonce commitment.
        share:
          type: string
          description: Base64. The signer's signature share (FROST), or its round data (two-party ECDSA, RSA).
        signature:
          type: string
          description: Base64. A whole signature, for a scheme where the signer finishes one.
        engineCommitmentId:
          type: string
          description: Two-party ECDSA only. The presigned slot (signerPresign) the share was made with; spent whatever the outcome.
        venueResponse: { $ref: '#/components/schemas/VenueResponse' }
        refusal:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: Why the signer would not sign; recorded on the decision.
    VenueResponse:
      type: object
      required: [status, body]
      properties:
        status: { type: integer }
        headers:
          type: object
          additionalProperties: { type: string }
        body:
          type: string
          description: Base64.
    SigningStatus:
      type: object
      required: [status]
      description: Where an order stands with the agent's signer, on decisions through a connected account whose venue key needs the signer (every exchange and Hyperliquid connected account).
      properties:
        status:
          type: string
          enum: [waiting, signed, refused, unreachable]
        requestedAt: { type: string, format: date-time }
        answeredAt: { type: string, format: date-time }
        attempts: { type: integer }
        detail:
          type: string
          description: The signer's refusal reason, or why it could not be reached.
    PositionInput:
      type: object
      required: [venue, symbol, side, size, entryPrice, markPrice, agentId, connectedAccountId]
      properties:
        venue: { $ref: '#/components/schemas/Venue' }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        size: { $ref: '#/components/schemas/Decimal' }
        entryPrice: { $ref: '#/components/schemas/Decimal' }
        markPrice: { $ref: '#/components/schemas/Decimal' }
        agentId: { type: string }
        connectedAccountId: { type: string }
    MarkInput:
      type: object
      required: [venue, symbol, price]
      properties:
        venue: { $ref: '#/components/schemas/Venue' }
        symbol: { type: string }
        price: { $ref: '#/components/schemas/Decimal' }
    StateImport:
      type: object
      required: [positions, marks, equityUsd, highWaterMarkUsd]
      properties:
        positions:
          type: array
          items: { $ref: '#/components/schemas/PositionInput' }
        marks:
          type: array
          description: |
            Last known prices per venue symbol. Market orders are priced at the
            mark; a symbol without one is blocked. Nothing is assumed, not even
            that a stablecoin is worth 1.
          items: { $ref: '#/components/schemas/MarkInput' }
        equityUsd:
          $ref: '#/components/schemas/Decimal'
          description: Account equity, the denominator for account-scope leverage.
        highWaterMarkUsd:
          $ref: '#/components/schemas/Decimal'
          description: Peak equity, the reference for account-scope drawdown.
    PnlTotals:
      type: object
      description: |
        PnL over a day or a range of days, for one scope. The engine books it
        as positions move: a fill that closes part of a position realises
        its PnL at the position's average entry, its fee goes to the book
        whose order it was, and a funding payment is shared among the books
        by each one's own position (the unassigned book takes what the books
        do not explain). A day runs from the moment the engine opens it,
        just after midnight UTC, to the next.
      required: [realizedUsd, unrealizedUsd, feesUsd, fundingUsd, netUsd, realizedNetUsd]
      properties:
        realizedUsd:
          $ref: '#/components/schemas/Decimal'
          description: Closed trading PnL, before fees and funding.
        unrealizedUsd:
          $ref: '#/components/schemas/Decimal'
          description: The change in the open positions' value at their marks; today's moves with the marks.
        feesUsd:
          $ref: '#/components/schemas/Decimal'
          description: Trading fees paid, negative; a rebate is positive.
        fundingUsd:
          $ref: '#/components/schemas/Decimal'
          description: Funding received, negative when paid.
        netUsd:
          $ref: '#/components/schemas/Decimal'
          description: The PnL, realized + unrealized + fees + funding. daily_loss and the portfolio and agent drawdowns read it.
        realizedNetUsd:
          $ref: '#/components/schemas/Decimal'
          description: The realized PnL, realized + fees + funding, without the open positions' moves. daily_realized_loss reads it.
    PnlDay:
      allOf:
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
        - $ref: '#/components/schemas/PnlTotals'
    PnlSeries:
      type: object
      required: [scope, name, from, to, days, totals]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        name: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days:
          type: array
          items: { $ref: '#/components/schemas/PnlDay' }
        totals: { $ref: '#/components/schemas/PnlTotals' }
    PnlSummaryRow:
      type: object
      required: [scope, name, dayNetUsd, mtdNetUsd, realizedUsd, unrealizedUsd, grossExposureUsd]
      properties:
        scope: { $ref: '#/components/schemas/Scope' }
        name: { type: string }
        parentId:
          type: string
          description: The portfolio an agent belongs to. Lets the table nest rows.
        dayNetUsd: { $ref: '#/components/schemas/Decimal' }
        mtdNetUsd: { $ref: '#/components/schemas/Decimal' }
        realizedUsd:
          $ref: '#/components/schemas/Decimal'
          description: Month to date.
        unrealizedUsd: { $ref: '#/components/schemas/Decimal' }
        grossExposureUsd: { $ref: '#/components/schemas/Decimal' }
    PnlSummary:
      type: object
      required: [asOf, rows]
      properties:
        asOf: { type: string, format: date-time }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PnlSummaryRow' }
    Position:
      type: object
      required: [id, venue, symbol, side, size, entryPrice, markPrice, notionalUsd, unrealizedUsd]
      properties:
        id: { type: string }
        venue: { $ref: '#/components/schemas/Venue' }
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        size: { $ref: '#/components/schemas/Decimal' }
        entryPrice: { $ref: '#/components/schemas/Decimal' }
        markPrice: { $ref: '#/components/schemas/Decimal' }
        notionalUsd: { $ref: '#/components/schemas/Decimal' }
        unrealizedUsd: { $ref: '#/components/schemas/Decimal' }
        leverage: { $ref: '#/components/schemas/Decimal' }
        agentId: { type: string }
        portfolioId: { type: string }
        connectedAccountId: { type: string }
        book:
          type: string
          enum: [agent, unassigned]
          description: |
            unassigned: a holding no agent owns, such as a manual trade on a shared
            connected account, an asset deposited in kind, or what a retired agent held;
            agentId and portfolioId are then absent. Account and connected account rules see
            the unassigned book; agent and portfolio rules do not. Absent means agent.
    PositionReassign:
      type: object
      required: [symbol, size]
      properties:
        symbol: { type: string }
        size:
          $ref: '#/components/schemas/Decimal'
          description: How much to move, positive, in the direction the giving book holds.
        fromAgentId:
          type: string
          description: The agent giving the holding. Absent means the unassigned book.
        toAgentId:
          type: string
          description: The agent receiving it. Absent means the unassigned book; the two must differ.
        comment: { type: string }

    DiscrepancyKind:
      type: string
      enum: [foreign_fill, unexplained_position, unexplained_balance, ambiguous_transfer, stream_gap]
      description: |
        foreign_fill: a fill the venue reported that Mishmar did not place;
        restricts an agents-only connected account, and on a shared connected account is already in the
        unassigned book and listed only for re-attribution. unexplained_position: a
        venue position that disagrees with the books with nothing to explain
        it; that asset on the connected account is degraded, and every agent holding it has
        the difference added to its agent rules in whichever direction is
        worse. unexplained_balance: a cash or collateral change with nothing to
        explain it; nothing is degraded, a drop counts as a loss and a rise is
        not counted until resolved. ambiguous_transfer: an asset several agents
        hold was transferred out beyond what the unassigned book holds; that asset
        is degraded until the owner names the agent it came from. stream_gap:
        the venue's stream missed more than its history can fill; the whole
        connected account is degraded until the engine has re-read the venue.
    DiscrepancyStatus:
      type: string
      enum: [open, resolved]
    Discrepancy:
      type: object
      required: [id, connectedAccountId, kind, status, restricts, detectedAt]
      properties:
        id: { type: string }
        connectedAccountId: { type: string }
        kind: { $ref: '#/components/schemas/DiscrepancyKind' }
        status: { $ref: '#/components/schemas/DiscrepancyStatus' }
        restricts:
          type: string
          enum: [connected_account, asset, none]
          description: What it blocks for new risk while open. Exits always pass.
        asset: { type: string, description: The asset concerned, when there is one. }
        detectedAt: { type: string, format: date-time }
        venueQuantity:
          $ref: '#/components/schemas/Decimal'
          description: The venue's position (signed, long positive) or balance when detected.
        booksQuantity:
          $ref: '#/components/schemas/Decimal'
          description: What the books add up to, the unassigned book included.
        difference:
          $ref: '#/components/schemas/Decimal'
          description: venueQuantity minus booksQuantity.
        fill: { $ref: '#/components/schemas/DiscrepancyFill' }
        duringMaintenance:
          type: boolean
          description: The fill fell in a maintenance window, so it restricts nothing.
        suggestion:
          type: object
          required: [assignTo, reason]
          description: The engine's guess, e.g. a fill that exactly offsets one agent's position.
          properties:
            assignTo: { $ref: '#/components/schemas/DiscrepancyAssignTo' }
            agentId: { type: string }
            reason: { type: string }
        resolution:
          type: object
          required: [assignTo, decidedBy, decidedAt]
          properties:
            assignTo: { $ref: '#/components/schemas/DiscrepancyAssignTo' }
            agentId: { type: string }
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
            comment: { type: string }
    DiscrepancyFill:
      type: object
      required: [venueFillId, symbol, side, size, price, at]
      properties:
        venueFillId: { type: string }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/Side' }
        size: { $ref: '#/components/schemas/Decimal' }
        price: { $ref: '#/components/schemas/Decimal' }
        at: { type: string, format: date-time }
    DiscrepancyAssignTo:
      type: string
      enum: [unassigned, agent, capital]
      description: |
        unassigned: book it to the connected account's unassigned book. agent: book it to `agentId`'s
        book, an agent on the connected account (for an ambiguous transfer, the agent it
        came from). capital: it was a transfer in or out, recorded at the mark,
        moving equity and the drawdown baseline together.
    DiscrepancyResolve:
      type: object
      required: [assignTo]
      properties:
        assignTo: { $ref: '#/components/schemas/DiscrepancyAssignTo' }
        agentId:
          type: string
          description: Required when assignTo is agent, refused otherwise.
        comment: { type: string }
