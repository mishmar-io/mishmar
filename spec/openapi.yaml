openapi: 3.1.0
info:
  title: Mishmar API
  version: 0.13.0
  summary: Trading-aware policy service at the signing layer.
  description: |
    Mishmar checks every order, transaction or signed message an agent produces
    against wallet-wide and per-agent risk rules before the key co-signs or the
    exchange proxy forwards it.

    Three callers share it: people through the web app with a bearer token;
    agents with their own Ed25519 key, through `POST /proposals` and the
    `agent` tag (reads of their own state and the signer channel); and
    operators through the CLI. The contract lives in the public mishmar repo,
    and the engine, the web app and the SDKs are generated from it.

    Conventions:
    - All timestamps are RFC 3339 strings in UTC.
    - Money and quantities are decimal strings (see the Decimal schema), never
      JSON numbers, so the bytes an agent signs are the bytes the engine verifies
      and no cent is lost to binary floating point.
    - Every mutation of configuration bumps the account's `configRevision`.
    - Lists that can grow without bound (decisions) are cursor paginated.
servers:
  - url: http://localhost:8080/v1
    description: Self-hosted engine on a laptop
security:
  - bearerAuth: []
tags:
  - name: account
  - name: portfolios
  - name: agents
  - name: trading-accounts
  - name: rules
  - name: decisions
  - name: approvals
  - name: pnl
  - name: proposals
  - name: ledger
    description: Agent-facing. Signed with the agent's key, not the operator token.
  - name: agent
    description: |
      Agent-facing: what a bot needs to function without acting on the account.
      Reads of the agent's own decisions, approvals, positions, PnL and trading accounts,
      and the signer channel through which the agent's signer co-signs venue
      requests. Authenticated with the agent's key (agentAuth), never the
      operator token.

paths:
  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: The caller's account, its kill switch and current configuration revision
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/kill:
    post:
      tags: [account]
      operationId: killAccount
      summary: Stop all trading. Every proposal is refused, reduce-only included, until resumed.
      description: |
        The console calls this "Stop all trading". Nothing is closed or
        cancelled: the engine holds only its half of each trading key and never
        trades on its own. Positions and resting orders stay at the venue.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/pause:
    post:
      tags: [account]
      operationId: pauseAccount
      summary: Pause all trading. Only reduce-only orders pass, so agents can wind down, until resumed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /account/resume:
    post:
      tags: [account]
      operationId: resumeAccount
      summary: Resume trading. Clears both the stop and the pause.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }

  /account/entitlements:
    put:
      tags: [account]
      operationId: setAccountEntitlements
      summary: Write the account's entitlements. The hosted control plane does this when the plan changes; any other caller is refused.
      description: |
        What the tier includes, which the engine then reads from its
        configuration cache on every proposal (the commitment batch, the
        signer transports). Only a request the hosted control plane makes with
        its own token may write it; an operator's token is refused with 403,
        and a self-hosted engine reads a signed licence instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Entitlements' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        default: { $ref: '#/components/responses/Error' }
  /whoami:
    get:
      tags: [account]
      operationId: whoami
      summary: Who the caller is and which mode the engine runs in
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operator' }
        default: { $ref: '#/components/responses/Error' }

  /portfolios:
    get:
      tags: [portfolios]
      operationId: listPortfolios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [portfolios]
      operationId: createPortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    get:
      tags: [portfolios]
      operationId: getPortfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [portfolios]
      operationId: updatePortfolio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortfolioUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [portfolios]
      operationId: deletePortfolio
      summary: Delete an empty portfolio. Refused while it still holds agents.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}/kill:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [portfolios]
      operationId: killPortfolio
      summary: Kill switch for every agent in the portfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }
  /portfolios/{portfolioId}/resume:
    parameters:
      - $ref: '#/components/parameters/portfolioId'
    post:
      tags: [portfolios]
      operationId: resumePortfolio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Portfolio' }
        default: { $ref: '#/components/responses/Error' }

  /agents:
    get:
      tags: [agents]
      operationId: listAgents
      parameters:
        - name: portfolioId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AgentStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [agents]
      operationId: createAgent
      summary: Add an agent. It starts active with no key and no trading accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
    get:
      tags: [agents]
      operationId: getAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [agents]
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      operationId: deleteAgent
      summary: Delete an agent. Its keys are revoked and its decisions are kept.
      description: |
        Retiring an agent releases its whole book: its positions on every trading account
        move to that trading account's unassigned book at the mark, so a withdrawal of what it
        held afterwards comes from the unassigned book and restricts nothing.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/keys:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: issueAgentKey
      summary: Issue a new API key. The secret is returned once and never again.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentKeyIssued' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [agents]
      operationId: revokeAgentKey
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys:
    parameters:
      - $ref: '#/components/parameters/agentId'
    get:
      tags: [agents]
      operationId: listVenueKeys
      summary: The agent's trading keys, one per trading account it may use
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [agents]
      operationId: createVenueKey
      summary: Give the agent a trading key on a trading account
      description: |
        The agent may then propose through the trading account. The key is a
        two-party key and the engine never holds it whole. For venues with
        ECDSA keys (Hyperliquid, Coinbase) it is made by two-party key
        generation: send no `engineShare`, and the agent's signer runs
        signerKeygen, after which the key carries the API wallet's address
        for the master wallet to approve (`approval`). For venues with
        Ed25519 or RSA keys it is dealt on the owner's machine for now
        (`mishmar keygen`, or `mishmar add-agent`, which does all of this):
        `engineShare` is the engine's share, the agent's share goes to the
        agent's signer, and the response carries the public key to register
        at the exchange (then `register` with the key id the venue issues).
        For HMAC venues there is no share: the signer the customer runs holds
        the whole key, and the engine records only that the key exists.
        Verify the key afterwards; it becomes `active` when the venue accepts
        a co-signed read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueKeyCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    get:
      tags: [agents]
      operationId: getVenueKey
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      operationId: revokeVenueKey
      summary: Revoke the key. The engine forgets its share; revoke the key at the venue as well.
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/register:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: registerVenueKey
      summary: Record the key id the exchange issued when the public key was registered
      description: |
        Exchanges with Ed25519, ECDSA or RSA keys issue a key id on
        registration; the engine sends it in the header the venue expects.
        Verify the key next. A Hyperliquid API wallet (approved, not
        registered) and an HMAC key (its id travels with the signer that holds
        it) refuse this with a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueKeyRegistration' }
      responses:
        '200':
          description: OK. Verify the key next.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/approval:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: createWalletApproval
      summary: Start the master wallet's approval of the agent's API wallet
      description: |
        Hyperliquid keys only (409 for other venues). Returns the EIP-712 typed
        data the master wallet must sign in the browser to approve this key's
        API wallet. The engine builds it, so the venue's signing rules live in
        one place. The signature goes back through `submitWalletApproval` with
        the `approvalId`. The typed data expires; ask again if it does.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletApprovalRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletApproval' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/approval/signature:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: submitWalletApproval
      summary: Submit the master wallet's signature; the engine sends the approval to the venue
      description: |
        Errors: `approval_expired` (409) when the typed data expired or was already
        used, ask for new typed data; `venue_rejected` (409) when the venue refused
        the signature, with the venue's message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalletApprovalSignature' }
      responses:
        '200':
          description: |
            OK: the venue took the signature and the engine verified the key
            again. The key as the venue now sees it: approved, and active when
            every check passed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/venue-keys/{venueKeyId}/verify:
    parameters:
      - $ref: '#/components/parameters/agentId'
      - $ref: '#/components/parameters/venueKeyId'
    post:
      tags: [agents]
      operationId: verifyVenueKey
      summary: Prove the key end to end
      description: |
        The engine asks the agent's signer to co-sign a harmless read and sends
        it to the venue, so one call proves the whole chain: the signer is
        connected, both shares agree, the venue knows the key. Needs the agent's
        signer connected (`signer_unreachable`, 409, otherwise). Checks: the
        venue accepts the co-signed request, the key cannot withdraw, the IP
        allowlist is set (live). All pass and the key becomes `active`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueKey' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/pause:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: pauseAgent
      summary: Pause. Only reduce-only orders pass while paused.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/resume:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: resumeAgent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{agentId}/kill:
    parameters:
      - $ref: '#/components/parameters/agentId'
    post:
      tags: [agents]
      operationId: killAgent
      summary: Kill. Nothing passes, including reduce-only, until resumed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        default: { $ref: '#/components/responses/Error' }

  /trading-accounts:
    get:
      tags: [trading-accounts]
      operationId: listTradingAccounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [trading-accounts]
      operationId: createTradingAccount
      summary: |
        Add a venue account: for an exchange, a read-only key the engine uses for
        margin, positions and fills; for Hyperliquid, the master address and the
        network; for Fireblocks, the callback. The trading account stays `pending` until
        `verify` passes. Trading keys are not here: each agent gets its own on
        the trading account (VenueKey).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradingAccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    get:
      tags: [trading-accounts]
      operationId: getTradingAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [trading-accounts]
      operationId: updateTradingAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradingAccountUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [trading-accounts]
      operationId: deleteTradingAccount
      summary: Remove the trading account. Refused while any agent holds a venue key on it.
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/verify:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: verifyTradingAccount
      summary: |
        Run the venue checks: the exchange's read-only key is accepted and can
        neither trade nor withdraw, the account has margin and is in one-way
        mode, the environment matches; the Hyperliquid master exists on the
        network; the Fireblocks callback is registered. All pass and the trading account
        becomes `active`. Each agent's trading key is verified on its own
        (`verifyVenueKey`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/pause:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: pauseTradingAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/resume:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: resumeTradingAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/kill:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: killTradingAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/maintenance:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: openMaintenance
      summary: Open a maintenance window to trade the account by hand
      description: |
        While the window is open the trading account's agents are paused (only
        reduce-only orders pass) and fills Mishmar did not place are expected:
        each is booked to the unassigned book for now and listed as a discrepancy
        with `duringMaintenance`, and an agents-only trading account is not restricted by
        them. Opening a window that is already open is a conflict (409).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceOpen' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/maintenance/close:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: closeMaintenance
      summary: Close the maintenance window and resume the agents it paused
      description: |
        Agents that were paused before the window opened stay paused. The
        window's fills stay where they were booked, in the unassigned book unless
        a discrepancy was resolved to an agent; the console asks the owner to
        assign them before closing, and they can be re-assigned afterwards.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TradingAccount' }
        default: { $ref: '#/components/responses/Error' }
  /trading-accounts/{tradingAccountId}/positions/reassign:
    parameters:
      - $ref: '#/components/parameters/tradingAccountId'
    post:
      tags: [trading-accounts]
      operationId: reassignPosition
      summary: Move part or all of a position between books on the trading account, at the mark
      description: |
        Release an agent's holding to the unassigned book (before withdrawing it),
        hand an unassigned holding to an agent (an asset deposited for it to trade),
        or move a holding between agents. Nothing is sent to the venue and the
        venue's position does not change. The move is booked at the mark: the
        giving book realises its PnL to the mark and the receiving book's entry
        price is the mark, so its PnL starts at zero. Refused (422) when the
        giving book holds less than `size` in that direction, and when the
        symbol has no mark.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PositionReassign' }
      responses:
        '200':
          description: The trading account's positions in the symbol, every book, after the move.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Position' }
        default: { $ref: '#/components/responses/Error' }

  /discrepancies:
    get:
      tags: [trading-accounts]
      operationId: listDiscrepancies
      summary: Changes at the venue the books could not explain, newest first
      description: |
        What the console's resolve screen lists: fills Mishmar did not place,
        positions or balances that disagree with the books, and stream gaps.
        Each says what it restricts while open (`restricts`).
      parameters:
        - name: tradingAccountId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DiscrepancyStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }
  /discrepancies/{discrepancyId}:
    parameters:
      - $ref: '#/components/parameters/discrepancyId'
    get:
      tags: [trading-accounts]
      operationId: getDiscrepancy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }
  /discrepancies/{discrepancyId}/resolve:
    parameters:
      - $ref: '#/components/parameters/discrepancyId'
    post:
      tags: [trading-accounts]
      operationId: resolveDiscrepancy
      summary: Say what the change was, which lifts whatever it restricted
      description: |
        Assign a fill or a position difference to the unassigned book or to an
        agent on the trading account, or record a balance change as a transfer
        (`capital`). A resolved discrepancy can be resolved again to move it,
        so a re-attribution after the fact is the same call. Resolving a
        stream gap is refused (409): the engine clears it when it has re-read
        the venue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscrepancyResolve' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discrepancy' }
        default: { $ref: '#/components/responses/Error' }

  /rules:
    get:
      tags: [rules]
      operationId: listRules
      parameters:
        - name: scopeKind
          in: query
          schema: { $ref: '#/components/schemas/ScopeKind' }
        - name: scopeId
          in: query
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
