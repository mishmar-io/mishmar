# On a version tag, build `mishmar` (the agent's signer, the engine's signer
# service and the CLI, one binary) on every platform it ships for and attach
# the binaries and their checksums to the GitHub release. The binary links
# Coinbase's cb-mpc (C++, cgo) through the mishmar-io fork of cb-mpc-go, so
# each platform builds on its own OS. darwin-arm64 is the exception: it is
# cross-compiled on an Intel Mac, because GitHub's Apple Silicon runners went
# hours without picking up a job (v0.2.0). That job cannot run what it builds,
# so it skips the tests (darwin-amd64 runs them on the same code) and checks
# the binary's architecture instead.
#
# The fork is checked out next to this repo at the ref in cbmpc.ref (go.mod
# replaces github.com/mishmar-io/cb-mpc-go with ../cb-mpc-go). Its C++ build
# and the static OpenSSL it needs are cached by that ref.
#
# Run by hand (workflow_dispatch) it builds every archive and attaches nothing.
name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  # cb-mpc prints a stack trace on every protocol failure unless built with
  # DY_NO_LOG; a refused message is an expected failure, not a crash.
  CXXFLAGS: -DDY_NO_LOG
  # The deployment target of the C++ library and OpenSSL must be what Go
  # links for, or the macOS linker warns on every build.
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  CBMPC_OPENSSL_ROOT: /usr/local/opt/openssl@3.6.1

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64, openssl: build-static-openssl-linux.sh }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, openssl: build-static-openssl-linux.sh }
          - { runner: macos-15-intel, os: darwin, arch: arm64, openssl: build-static-openssl-macos-m1.sh, cross: true }
          - { runner: macos-15-intel, os: darwin, arch: amd64, openssl: build-static-openssl-macos.sh }
    env:
      # Go builds for the matrix's architecture: the runner's own everywhere
      # but the cross-compiled darwin-arm64, where cgo passes -arch arm64.
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out mishmar
        uses: actions/checkout@v4
        with:
          path: mishmar

      - name: Read the cb-mpc-go ref
        id: cbmpc
        run: echo "ref=$(tr -d '[:space:]' < mishmar/cbmpc.ref)" >> "$GITHUB_OUTPUT"

      - name: Check out the cb-mpc-go fork (with the cb-mpc submodule)
        uses: actions/checkout@v4
        with:
          repository: mishmar-io/cb-mpc-go
          ref: ${{ steps.cbmpc.outputs.ref }}
          path: cb-mpc-go
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: mishmar/go.mod
          cache-dependency-path: mishmar/go.sum

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl perl pkg-config rsync

      - name: Install build dependencies (macOS)
        if: matrix.os == 'darwin'
        run: brew install cmake

      - name: Restore the C++ builds
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/opt/openssl@3.6.1
            cb-mpc-go/cb-mpc/build
            cb-mpc-go/cb-mpc/lib
          key: cbmpc-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.cbmpc.outputs.ref }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}

      - name: Build the static OpenSSL
        if: steps.cache.outputs.cache-hit != 'true' && !matrix.cross
        run: sudo --preserve-env=MACOSX_DEPLOYMENT_TARGET bash cb-mpc-go/scripts/openssl/${{ matrix.openssl }}

      # Apple's clang targets arm64 from an Intel Mac; the script's
      # darwin64-arm64-cc target passes -arch arm64.
      - name: Build the static OpenSSL (cross)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.cross
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: sudo --preserve-env=MACOSX_DEPLOYMENT_TARGET,CC,CXX bash cb-mpc-go/scripts/openssl/${{ matrix.openssl }}

      - name: Build cb-mpc
        if: steps.cache.outputs.cache-hit != 'true' && !matrix.cross
        run: bash cb-mpc-go/scripts/build_cpp.sh Release

      # cb-mpc's CMake picks its arm64 flags from CMAKE_OSX_ARCHITECTURES. Its unit tests are
      # left out: the build runs the test binary to list the tests, which an Intel Mac cannot.
      # Otherwise this is build_cpp.sh: the library, then its public install for cgo.
      - name: Build cb-mpc (cross)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.cross
        working-directory: cb-mpc-go/cb-mpc
        env:
          CMAKE_OSX_ARCHITECTURES: arm64
          BUILD_TYPE: Release
        run: |
          make build-no-test
          bash scripts/install.sh --mode public --build-type Release
          lipo -archs build/install/public/lib/libcbmpc.a

      - name: Test
        if: ${{ !matrix.cross }}
        working-directory: mishmar
        run: make test

      - name: Build the binary
        working-directory: mishmar
        run: |
          mkdir -p dist
          bash ../cb-mpc-go/scripts/go_with_cpp.sh go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/mishmar ./cmd/mishmar
          if [ "${{ matrix.cross }}" = "true" ]; then
            file dist/mishmar
            [ "$(lipo -archs dist/mishmar)" = "arm64" ]
          else
            ./dist/mishmar version
          fi
          # The binary links cb-mpc, OpenSSL and the Go modules statically, so
          # their licenses travel with it.
          cp LICENSE dist/
          python3 scripts/third_party_notices.py --openssl "${CBMPC_OPENSSL_ROOT##*@}" > dist/THIRD_PARTY_NOTICES
          name="mishmar_${GITHUB_REF_NAME}_${{ matrix.os }}_${{ matrix.arch }}"
          tar -C dist -czf "dist/${name}.tar.gz" mishmar LICENSE THIRD_PARTY_NOTICES
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: mishmar-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            mishmar/dist/*.tar.gz
            mishmar/dist/*.sha256
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out mishmar
        uses: actions/checkout@v4

      - name: Collect the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && cat SHA256SUMS

      - name: Create the release (draft)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--draft --generate-notes)
          case "${GITHUB_REF_NAME}" in *-*) flags+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --title "mishmar ${GITHUB_REF_NAME}" "${flags[@]}" -R "${GITHUB_REPOSITORY}" dist/*.tar.gz dist/SHA256SUMS
