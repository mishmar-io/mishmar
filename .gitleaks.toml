# gitleaks (the pre-commit hook reads this from the repo root): the default
# rules, less what they mistake for keys here. Every allowlist names one
# shape, so a real secret in the same files is still caught.

[extend]
useDefault = true

[[allowlists]]
description = "Mishmar ids: msh-<key>-<suffix> client order ids, <prefix>_<12> and key_<account>_<12>"
regexes = [
  '''^msh-[a-z0-9]+-[a-z0-9]{6}$''',
  '''^[a-z]{2,4}_[a-z0-9]{12}$''',
  '''^key_[a-z0-9]+_[a-z0-9]{12}$''',
]

[[allowlists]]
description = "A made-up agent API key's prefix in the SDK tests, msk_<environment>_<account>_<12 random>_ with the seed appended at run time; a whole key, seed and all, does not match"
regexes = ['''^msk_[a-z]+_[a-z0-9]+_[a-z0-9]{12}_?$''']

[[allowlists]]
description = "The names of Mishmar's environment variables, MISHMAR_S3_SECRET_KEY and the like; the values never appear in source"
regexes = ['''^MISHMAR_[A-Z0-9_]+$''']

[[allowlists]]
description = "The conformance vectors' Ed25519 test key, published with its public key so every SDK can check its signatures"
condition = "AND"
paths = ['''^spec/vectors/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"secret": "''']

[[allowlists]]
description = "The made-up Binance read key the docs' screenshot scripts type into the console's mock engine"
condition = "AND"
paths = ['''^docs/scripts/shots-[a-z-]+\.mjs$''']
regexTarget = "line"
regexes = ['''const READ_KEY = ''']

[[allowlists]]
description = "The made-up Hyperliquid addresses the docs' screenshot scripts show (an address, 0x and 40 hex digits, is public; a private key is 64 and does not match)"
condition = "AND"
paths = ['''^docs/scripts/shots-[a-z-]+\.mjs$''']
regexTarget = "line"
regexes = ['''const [A-Z_]+ = .0x[0-9a-f]{40}[^0-9a-f]''']
